<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Вечерняя крепость</title>
<style>
:root{--bg:#1b1622;--panel:#2a2233;--panel2:#352b40;--ink:#f3e9d7;--dim:#b7a98f;--gold:#f2c14e;--green:#7bc67b;--red:#e06666;--blue:#6fa8dc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#1b1622;color:var(--ink);font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;padding-bottom:80px}
header{position:sticky;top:0;z-index:5;background:rgba(27,22,34,.95);backdrop-filter:blur(6px);padding:10px 12px;border-bottom:1px solid #3d3247}
h1{margin:0 0 6px;font-size:18px;letter-spacing:.5px}
h1 small{color:var(--dim);font-weight:400;font-size:12px}
.res{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel);border-radius:999px;padding:4px 10px;font-weight:600;font-size:14px}
.chip i{font-style:normal;color:var(--dim);font-weight:400;font-size:11px}
main{padding:12px 0;max-width:620px;margin:0 auto}
main>*:not(.scroller){margin-left:12px;margin-right:12px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#140f19;border-top:1px solid #3d3247;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:0;color:var(--dim);padding:8px 0;font-size:10.5px}
.badge{position:absolute;top:2px;right:18%;background:#e0503a;color:#fff;border-radius:9px;font-size:10px;font-weight:800;padding:1px 5px}
.quest{border:1.5px solid rgba(242,193,78,.4);background:linear-gradient(#3a2e2a,#2a2233)}
.tabs button b{display:block;font-size:22px}
.tabs button.on{color:var(--gold)}
button.act{background:linear-gradient(#ffd66b,#e9a92e);color:#2a1e00;border:0;border-radius:10px;padding:9px 12px;font-weight:800;font-size:14px;box-shadow:0 3px 0 #9a6a14}
button.act:active{transform:translateY(2px);box-shadow:0 1px 0 #9a6a14}
button.act.sec{background:linear-gradient(#5d4b6e,#463856);color:var(--ink);box-shadow:0 3px 0 #2a2133}
button.act:disabled{opacity:.4}
.big{width:calc(100% - 24px);padding:14px;font-size:16px;margin:4px 12px 12px}
.card{background:var(--panel);border-radius:12px;padding:12px;margin:8px 12px}
.row{display:flex;align-items:center;gap:8px}
.row .grow{flex:1}
.pill{font-size:11px;background:#1b1622;border-radius:6px;padding:2px 6px;color:var(--dim)}
.sub{color:var(--dim);font-size:12px}
select{background:#1b1622;color:var(--ink);border:1px solid #4d3e5c;border-radius:8px;padding:8px;max-width:100%;width:100%;margin-top:6px}
.log{font-size:13px;color:var(--dim);max-height:200px;overflow:auto;background:#140f19;border-radius:10px;padding:8px}
.log div{margin:2px 0}
.toast{position:fixed;left:50%;top:90px;transform:translateX(-50%);background:var(--gold);color:#2a1e00;padding:10px 16px;border-radius:12px;font-weight:700;z-index:40;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:30}
.modal.show{display:flex}
.modal .box{background:var(--panel);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-width:620px;width:100%;max-height:85vh;overflow:auto}
.modal .box .card{margin:8px 0}
textarea{width:100%;height:110px;background:#140f19;color:var(--ink);border:1px solid #4d3e5c;border-radius:8px;padding:8px;font-size:12px}
.hp{height:10px;background:#140f19;border-radius:5px;overflow:hidden}
.hp>div{height:100%;transition:width .25s}
.bar{height:6px;background:#1b1622;border-radius:3px;margin-top:5px;overflow:hidden}
.bar>div{height:100%;background:var(--blue)}
h2{font-size:16px;margin:14px 12px 6px}
.modal h2{margin:14px 0 6px}

/* ===== Сцена ===== */
.scroller{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scene{position:relative;width:max-content;min-width:100%;padding:0 16px;
  background:linear-gradient(#141238 0%,#2d2358 22%,#6a3d6e 52%,#c56a5a 78%,#e8a066 100%)}
.sky{position:absolute;left:0;right:0;top:0;height:260px;width:100%;pointer-events:none}
.land{position:absolute;left:0;right:0;bottom:0;height:260px;width:100%;pointer-events:none}
.cloud{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(760px)}}
.tw{animation:tw 2.5s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.castle{position:relative;margin:0 auto;width:max-content;padding-top:40px}
.roof,.base{display:block;width:100%;height:auto}
.roof{margin-bottom:-1px}.base{margin-top:-1px}
.body{background:#4b3f38;padding:0 0 0;display:flex;flex-direction:column}
.floor{display:grid;grid-template-columns:26px repeat(9,92px) 26px;column-gap:3px;padding:3px 0 0;background:#4b3f38;border-bottom:6px solid #6b4a2f;box-shadow:inset 0 -2px 0 #3e2817}
.side{position:relative;height:104px;background:#5f5047;
  background-image:repeating-linear-gradient(0deg,#4a3d35 0 2px,transparent 2px 13px),repeating-linear-gradient(90deg,transparent 0 12px,#54463d 12px 13px)}
.side svg{position:absolute;inset:0;width:100%;height:100%}
.cell{position:relative;height:104px;border-radius:2px;overflow:hidden;cursor:pointer;background:#2a1f1a}
.cell svg.art{position:absolute;inset:0;width:100%;height:100%}
.cell.empty .plus{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#c9b29a;font-size:11px;font-weight:700;text-shadow:0 1px 2px #000}
.cell.empty .plus b{font-size:24px;line-height:1;background:rgba(0,0,0,.35);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px dashed #c9b29a;margin-bottom:3px}
.cell.target{outline:3px solid var(--gold);outline-offset:-3px}
.cell.target .plus{color:var(--gold)}
.cell.target .plus b{border-color:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.cell.moving{filter:brightness(.5) saturate(.4)}
.lbl{position:absolute;left:4px;top:13px;background:rgba(20,15,25,.78);border-radius:6px;padding:1px 6px;font-size:10.5px;font-weight:700;white-space:nowrap;max-width:calc(100% - 52px);overflow:hidden;text-overflow:ellipsis;border:1px solid rgba(255,220,150,.25)}
.lbl.wide{max-width:calc(100% - 8px)}
.lbl .bn{color:#8fe08f}
.lbl .lv{color:var(--gold)}
.stock{position:absolute;right:4px;top:12px;background:linear-gradient(#fffaf0,#f1dfb4);color:#3a2a10;border-radius:12px;padding:2px 7px 2px 5px;font-size:12px;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.45);border:1.5px solid #c99a3c;z-index:2}
.stock.ready{animation:bounce 1.1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.walker{position:absolute;bottom:4px;z-index:1;pointer-events:none;width:0;height:0}
.walker .chr{bottom:0;top:auto}
.walker .flip{transform-origin:center;transition:transform .32s ease-in-out}
.walker.act-work .armF{animation:armSwing 1.25s ease-in-out 2}.walker.act-work .wpn{animation:wpnAlign 1.25s ease-in-out 2}
.walker.act-wave .armF{animation:waveA 1.8s ease-in-out}
@keyframes waveA{0%{transform:rotate(0)}25%{transform:rotate(155deg)}40%{transform:rotate(128deg)}55%{transform:rotate(155deg)}70%{transform:rotate(128deg)}100%{transform:rotate(0)}}
.walker.act-stretch svg{animation:stretch 1.6s ease-in-out;transform-origin:50% 100%}
.walker.act-stretch .armF{animation:armUp 1.6s ease-in-out}
@keyframes stretch{40%,60%{transform:scaleY(1.05) scaleX(.97)}}
@keyframes armUp{40%,60%{transform:rotate(170deg)}}
.walker.act-jump svg{animation:jmp .75s ease-out}
@keyframes jmp{40%{transform:translateY(-7px)}70%{transform:translateY(0)}85%{transform:translateY(-2px)}}
.walker.idle svg{animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.5px)}}
.walker:not(.idle) .lg1{animation:step .32s infinite alternate}
.walker:not(.idle) .lg2{animation:step .32s infinite alternate-reverse}
.lg1,.lg2,.armF,.wpn{transform-box:view-box;transform-origin:0 0}
.wpn{transform:rotate(-14deg)}
@keyframes step{from{transform:rotate(22deg)}to{transform:rotate(-22deg)}}
.slots{position:absolute;right:5px;bottom:2px;font-size:10px;color:#fff;font-weight:700;text-shadow:0 1px 2px #000;z-index:2}
.flame{animation:flick .3s infinite alternate;transform-box:fill-box;transform-origin:center bottom}
@keyframes flick{to{transform:scaleY(.82) scaleX(1.08)}}
.flag{animation:wave 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
@keyframes wave{50%{transform:skewY(7deg) scaleX(.9)}}
.spark{animation:spark 1.2s linear infinite;transform-box:fill-box}
@keyframes spark{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),-26px);opacity:0}}
.twinkle{animation:twk 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twk{0%,100%{transform:scale(.2);opacity:0}50%{transform:scale(1);opacity:1}}
.glowp{animation:gp 2s ease-in-out infinite}
@keyframes gp{50%{opacity:.7}}
.movebar{position:sticky;top:82px;z-index:4;background:var(--gold);color:#2a1e00;border-radius:10px;padding:8px 12px;margin:0 12px 8px;display:flex;align-items:center;gap:8px;font-weight:700}
.opt{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:10px;padding:8px;margin:6px 0}
.opt .pv{height:52px;border-radius:6px;overflow:hidden;flex:none;position:relative;background:#2a1f1a}
.opt .pv svg{width:100%;height:100%}
.hint{margin:8px 12px}
/* ===== Снаряжение ===== */
.r0{color:#cfcfcf}.r1{color:#5ab0ff}.r2{color:#c48aff}.r3{color:#ffc04a}.r4{color:#ff6a5a;text-shadow:0 0 8px rgba(255,60,40,.6)}
.slotrow{display:flex;gap:6px;margin-top:8px}
.slot{flex:1;background:#1b1622;border:2px solid #4d3e5c;border-radius:10px;padding:4px;text-align:center;font-size:10px;color:var(--dim);min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.slot svg{width:38px;height:38px}
.slot.b1{border-color:#3a7ac0}.slot.b2{border-color:#8a4ad0;box-shadow:0 0 6px rgba(160,100,255,.3)}.slot.b3{border-color:#e0a030;box-shadow:0 0 10px rgba(255,180,50,.45)}.slot.b4{border-color:#ff4a3a;animation:mythb 1.6s infinite}
@keyframes mythb{50%{box-shadow:0 0 14px rgba(255,70,50,.75)}}
.icon{width:46px;height:46px;flex:none;border-radius:10px;background:radial-gradient(circle,#3d3150,#1b1622);border:2px solid #4d3e5c;display:flex;align-items:center;justify-content:center}
.icon svg{width:40px;height:40px}
.icon.b1{border-color:#3a7ac0;background:radial-gradient(circle,#2a3a5a,#1b1622)}.icon.b2{border-color:#8a4ad0;background:radial-gradient(circle,#4a2a6a,#1b1622)}.icon.b3{border-color:#e0a030;background:radial-gradient(circle,#6a4a1a,#1b1622);box-shadow:0 0 8px rgba(255,180,50,.4)}.icon.b4{border-color:#ff4a3a;background:radial-gradient(circle,#6a1a1a,#140808);animation:mythb 1.6s infinite}
.portrait{width:70px;height:96px;flex:none;border-radius:12px;background:radial-gradient(circle at 50% 70%,#4d3e5c,#1b1622);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.stats{font-size:12px;color:var(--ink);margin-top:3px}
/* ===== Скин интерфейса (Free Fantasy Game GUI, pzUH, CC0) ===== */
.modal .box{background:none;border-style:solid;border-width:30px 26px;border-color:transparent;border-image:url(assets/ui/panel.png) 80 70 fill / 30px 26px stretch;color:#3a2410;padding:4px 6px 10px;border-radius:0;max-height:88vh}
.modal .box h2,.modal .box b{color:#3a2410}
.modal .box .sub,.modal .box .stats{color:#6a4a2a}
.modal .box .opt,.modal .box .card,.modal .box .itemcard{background:rgba(110,70,30,.14);color:#3a2410}
.modal .box .pill{background:rgba(60,35,15,.75);color:#f3e2c0}
.modal .box select{background:#f6e7c4;color:#3a2410;border-color:#a87a4a}
.modal .box .hp{background:#5a3a22}
button.act{background:none;box-shadow:none;border-style:solid;border-width:7px 13px;border-color:transparent;border-image:url(assets/ui/btn_green.png) 34 46 fill / 7px 13px stretch;color:#fff;text-shadow:0 1px 0 #2a5a10,0 0 3px #2a5a10;padding:4px 6px;min-height:40px}
button.act:active{transform:translateY(1px);filter:brightness(.92);box-shadow:none}
button.act.sec{border-image-source:url(assets/ui/btn_gray.png);color:#3a3a40;text-shadow:0 1px 0 #fff}
button.act:disabled{opacity:.45;filter:grayscale(.6)}
.card{background:linear-gradient(#3a2e2a,#2a2233);border:1.5px solid rgba(201,154,60,.35)}
.chip{background:linear-gradient(#4a3424,#2a1d14);border:1.5px solid #8a5a2a;box-shadow:inset 0 1px 0 rgba(255,220,150,.2)}
.chip img{width:16px;height:16px;vertical-align:-3px}
.tabs{background:linear-gradient(#5a3a22,#3a2414);border-top:2px solid #8a5a2a}
.tabs button{color:#d9c39a}.tabs button.on{color:#ffd66b;text-shadow:0 0 6px rgba(255,200,80,.6)}
header{background:linear-gradient(rgba(58,36,20,.97),rgba(40,26,16,.97));border-bottom:2px solid #8a5a2a}
/* ===== Спрайты ===== */
.chr{position:absolute;width:0;height:0;transform:scale(var(--k)) scaleX(var(--f));transform-origin:0 0;transition:transform .25s}
.chr .si{position:absolute;bottom:0;background-repeat:no-repeat;image-rendering:auto}
.chr.aura3::before,.chr.aura4::before{content:'';position:absolute;left:-70px;bottom:-10px;width:140px;height:170px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,190,70,.45),transparent);animation:aura 2.4s ease-in-out infinite}
.chr.aura4::before{background:radial-gradient(closest-side,rgba(255,60,40,.55),transparent)}
.pframe{position:relative;width:100%;height:100%}
.pframe .chr{left:50%;bottom:6px;top:auto}
/* ===== Жизнь в комнатах ===== */
.dust{animation:dust 9s linear infinite}
@keyframes dust{0%{transform:translate(0,0);opacity:0}20%{opacity:.7}100%{transform:translate(18px,-30px);opacity:0}}
.peck{animation:peck 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:70% 90%}
@keyframes peck{0%,60%,100%{transform:rotate(0)}70%,80%{transform:rotate(-28deg)}75%{transform:rotate(-20deg)}}
.steam{animation:steam 2.4s ease-out infinite;transform-box:fill-box}
@keyframes steam{0%{transform:translate(0,0) scale(.6);opacity:.4}100%{transform:translate(4px,-22px) scale(1.6);opacity:0}}
/* ===== Эффекты редкости ===== */
.mythfx{animation:flick .35s infinite alternate;transform-box:fill-box;transform-origin:center bottom}
.ember{animation:ember 1.5s linear infinite;transform-box:fill-box}
@keyframes ember{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),-22px);opacity:0}}
.aura{animation:aura 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes aura{50%{opacity:.25;transform:scale(.92)}}
/* ===== Анимации атак ===== */
.atk-swing .armF{animation:armSwing .6s ease-in-out}.atk-swing .wpn{animation:wpnAlign .6s ease-in-out}
@keyframes armSwing{0%{transform:rotate(0)}35%{transform:rotate(200deg)}65%{transform:rotate(55deg)}100%{transform:rotate(0)}}
@keyframes wpnAlign{0%{transform:rotate(-14deg)}20%,80%{transform:rotate(-165deg)}100%{transform:rotate(-14deg)}}
.atk-thrust .armF{animation:armThrust .55s ease-in-out}.atk-thrust .wpn{animation:wpnFwd .55s ease-in-out}
@keyframes armThrust{0%{transform:rotate(0)}30%{transform:rotate(70deg)}55%{transform:rotate(95deg) translateY(4px)}100%{transform:rotate(0)}}
@keyframes wpnFwd{0%{transform:rotate(-14deg)}25%,80%{transform:rotate(-180deg)}100%{transform:rotate(-14deg)}}
.atk-shoot .armF{animation:armAim .7s ease-in-out}.atk-shoot .wpn{animation:wpnBow .7s ease-in-out}
@keyframes armAim{0%{transform:rotate(0)}30%,75%{transform:rotate(90deg)}100%{transform:rotate(0)}}
@keyframes wpnBow{0%{transform:rotate(-14deg)}30%,75%{transform:rotate(-90deg)}100%{transform:rotate(-14deg)}}
.atk-xbow .armF{animation:armAim .7s ease-in-out}.atk-xbow .wpn{animation:wpnFwd .7s ease-in-out}
.atk-cast .armF{animation:armCast .8s ease-in-out}.atk-cast .wpn{animation:wpnCast .8s ease-in-out}.atk-cast .orbglow{animation:orb .8s}
@keyframes armCast{0%{transform:rotate(0)}35%,75%{transform:rotate(150deg)}100%{transform:rotate(0)}}
@keyframes wpnCast{0%{transform:rotate(-14deg)}35%,75%{transform:rotate(-150deg)}100%{transform:rotate(-14deg)}}
@keyframes orb{40%,70%{transform:scale(2.2);opacity:1}}
.orbglow{transform-box:fill-box;transform-origin:center}
.atk-punch .armF{animation:armThrust .45s ease-in-out}
/* ===== Арена ===== */
.arena{position:relative;height:240px;border-radius:12px;overflow:hidden;margin:8px 0;background:#2a2038}
.unit{position:absolute;transform:translateX(-50%);transition:left .3s,right .3s,opacity .5s,filter .5s}
.unit.e{transform:translateX(50%)}
.unit .spr{position:relative;height:100%}.unit .spr .chr{left:50%;bottom:0;top:auto}
.unit.step{left:calc(var(--x,0) + 8%)}
.unit.h.step .spr{animation:stepf .6s}
@keyframes stepf{40%{translate:26px 0}}
.unit.dead{opacity:.75}.unit.dead .hpb{opacity:0}
.unit.dead .spr{transform-origin:bottom;rotate:0deg}
.hpb{width:34px;height:5px;background:#140f19;border-radius:3px;margin:0 auto 2px;overflow:hidden;border:1px solid #000}
.hpb>div{height:100%;background:linear-gradient(#9be08f,#4caa4c);transition:width .3s}
.hpb.e>div{background:linear-gradient(#ff8a7a,#c43a3a)}
.e-lunge{animation:elunge .55s}
@keyframes elunge{40%{translate:-30px 0;scale:1.05}}
.e-cast{animation:ecast .6s}
@keyframes ecast{40%{filter:brightness(1.6) drop-shadow(0 0 8px #7aff9a)}}
.spr.hit{animation:hit .3s}
.atk-swing.hit,.atk-thrust.hit{animation:hit .3s}
.proj{position:absolute;z-index:6;pointer-events:none}
.dmg.crit{color:#ffb52e;font-size:22px}
.runes{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.lunge{animation:lunge .35s}
@keyframes lunge{50%{transform:translateX(16px)}}
.hit{animation:hit .3s}
@keyframes hit{25%{translate:-4px 0;filter:brightness(2.2) drop-shadow(0 0 6px red)}75%{translate:4px 0}}
.dmg{position:absolute;font-weight:900;font-size:17px;color:#ffe08a;text-shadow:0 2px 0 #000,0 0 6px #000;animation:up .85s forwards;pointer-events:none;z-index:7;white-space:nowrap}
.dmg.bad{color:#ff7070}
@keyframes up{to{transform:translateY(-36px);opacity:0}}
/* ===== Сундуки ===== */
.chests{display:flex;justify-content:space-around;align-items:flex-end;margin:14px 0 6px;min-height:150px}
.chest{width:30%;text-align:center;cursor:pointer;position:relative}
.chest svg{width:100%;height:auto;overflow:visible}
.chest .lid{transition:transform .5s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:10% 100%}
.chest.open .lid{transform:translate(-4px,-10px) rotate(-28deg)}
.chest .shine{opacity:0;transition:opacity .4s}
.chest.open .shine{opacity:1}
.chest.idle{animation:wob 1.6s ease-in-out infinite}
.chest:nth-child(2).idle{animation-delay:.3s}.chest:nth-child(3).idle{animation-delay:.6s}
@keyframes wob{0%,100%{transform:rotate(0)}10%{transform:rotate(-4deg)}20%{transform:rotate(4deg)}30%{transform:rotate(0)}}
.chest.shake{animation:shk .5s}
@keyframes shk{20%{transform:rotate(-8deg) scale(1.05)}40%{transform:rotate(8deg) scale(1.1)}60%{transform:rotate(-6deg) scale(1.1)}80%{transform:rotate(4deg)}}
.chest.missed{opacity:.45;filter:grayscale(.6)}
.chest .prize{font-size:12px;font-weight:800;min-height:34px;margin-top:4px}
.burst{animation:burst .9s ease-out forwards;transform-box:fill-box}
@keyframes burst{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),-46px);opacity:0}}
.itemcard{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:12px;padding:10px;margin-top:8px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>

      <rect width="30" height="16" fill="#9a8573"/>

<script>
// ================= Данные =================
const COLS=9;
const RES={food:{n:'Еда',i:'🥕'},gold:{n:'Монеты',i:'🪙'},ore:{n:'Руда',i:'⛏️'}};
const T={

  treasury:{n:'Казна',    i:'🪙',w:2,res:'gold',skill:'trade',base:30,cap:250,build:{food:80},         tint:'#5a4210',d:'Копит монеты'},
  forge:   {n:'Кузня',    i:'⚒️',w:2,res:'ore', skill:'craft',base:22,cap:180,build:{food:60,gold:60}, tint:'#4a1e14',d:'Даёт руду'},
  guard:   {n:'Караульня',i:'🛡️',w:3,skill:'fight',build:{gold:120,ore:40},tint:'#1e3050',d:'Тут живут воины'},

};
const SKILLS={farm:'🌾 Земледелие',trade:'💼 Торговля',craft:'🔨 Ремесло',fight:'🗡️ Бой'};
const SKCOL={farm:'#5aa64a',trade:'#d9a62a',craft:'#c8642a',fight:'#3f78c4'};
const SKIN=['#f7d6b8','#eab890','#c98e64','#8d5a3b'];
const HAIR=['#3a2516','#7a4a22','#e0bb5e','#b8442a','#2a2a2a','#e8e2d8'];
const NAMES=['Ярема','Злата','Мирон','Велта','Остап','Ладимира','Гордей','Белава','Тихон','Рада','Добрыня','Веселина','Лука','Снежана','Ратибор','Олеся'];

const SPEED=1;

// ================= Состояние =================
let S,moving=null,tab='castle';
const rand=n=>Math.floor(Math.random()*n),rnd=a=>a[rand(a.length)];
const NM=['Ярема','Мирон','Остап','Гордей','Тихон','Добрыня','Лука','Ратибор','Всеслав','Елисей','Богдан','Святогор'];
const NF=['Злата','Велта','Ладимира','Белава','Рада','Веселина','Снежана','Олеся','Милава','Дарина','Забава','Любава'];
const EYES=['#4a7ab0','#5a8a3a','#7a4a22','#3a2a1a','#6a6a7a'];
const PANTS=['#4a3a5a','#3a4a5a','#5a4a32','#3a3a3a','#5a3a32'];
function looks(p){if(p.g===undefined)p.g=NF.includes(p.name)?1:NM.includes(p.name)?0:rand(2);
  if(p.hs===undefined)p.hs=p.g?2+rand(3):rand(2);if(p.beard===undefined)p.beard=!p.g&&Math.random()<.45;
  if(p.eye===undefined)p.eye=rand(EYES.length);if(p.pants===undefined)p.pants=rand(PANTS.length);if(!p.model)p.model=p.g?rnd(['princess','girl']):rnd(['aknight','pzknight']);if(!p.eq)p.eq={weapon:null,armor:null,helmet:null,acc:null};if(p.eq.acc===undefined)p.eq.acc=null;return p}
function newDweller(){const g=rand(2);return looks({id:Date.now()+Math.random(),g,name:rnd(g?NF:NM),skin:rand(SKIN.length),hair:rand(HAIR.length),lvl:1,xp:0,
  sk:{farm:1+rand(4),trade:1+rand(4),craft:1+rand(4),fight:1+rand(4)},room:null})}
function normalize(s){
  s.people.forEach(looks);
  if(!s.items){s.items=[];s.iid=0;
    const g=s.rooms.find(r=>r.t==='guard'),f=g&&s.people.find(p=>p.room===g.id)||s.people[0];
    if(f){const a=mkItem(s,'weapon','sword',0,0),b=mkItem(s,'armor','leather',0,0);f.eq.weapon=a.id;f.eq.armor=b.id}
    mkItem(s,'helmet','helm',0,0);
  }
  return s;
}
function mainSkill(p){return Object.keys(p.sk).reduce((a,k)=>p.sk[k]>p.sk[a]?k:a,Object.keys(p.sk)[0])}
function addRoom(s,t,f,c,lvl=1){const r={id:++s.nid,t,lvl,f,c,stock:0};s.rooms.push(r);return r}
function fresh(old){
  const s={v:3,nid:0,res:{food:150,gold:150,ore:40},tower:1,rooms:[],people:[],last:Date.now(),nextRecruit:Date.now()+30*60e3,stage:0,log:[],items:old&&old.items,iid:old&&old.iid};
  const R={garden:addRoom(s,'garden',0,0),treasury:addRoom(s,'treasury',0,3),forge:addRoom(s,'forge',1,0),bunk:addRoom(s,'bunk',1,2),guard:addRoom(s,'guard',2,0)};
  if(old&&old.res){
    s.res=old.res;s.stage=old.stage||0;s.log=old.log||[];s.tower=old.tower||(old.lvl&&old.lvl.tower)||1;s.nextRecruit=old.nextRecruit||s.nextRecruit;
    const typeOf=id=>{if(R[id])return id;const r=(old.rooms||[]).find(x=>x.id===id);return r?r.t:null};
    if(old.lvl)for(const k in R)if(old.lvl[k])R[k].lvl=old.lvl[k];
    (old.rooms||[]).forEach(r=>{if(R[r.t])R[r.t].lvl=Math.max(R[r.t].lvl,r.lvl)});
    s.people=(old.people||[]).map(p=>{const t=typeOf(p.room);return {...newDweller(),...p,room:t&&R[t]&&T[t].skill?R[t].id:null}});
    for(const k in R)while(s.people.filter(p=>p.room===R[k].id).length>slotsOf(R[k])){const p=s.people.find(p=>p.room===R[k].id);p.room=null}
    if(old.v!==3)s.log.unshift('🏗️ Крепость перестроена: теперь 5 клеток на этаже');
  }else{
    for(let i=0;i<4;i++)s.people.push(newDweller());
    [R.garden,R.treasury,R.forge,R.guard].forEach((r,i)=>s.people[i].room=r.id);
  }
  return s;
}
function save(){tick(Date.now());S.last=Date.now();try{localStorage.setItem('vk_save',JSON.stringify(S))}catch(e){}}
function load(){try{const t=localStorage.getItem('vk_save');if(t){const s=JSON.parse(t);return normalize(s.v===3?s:fresh(s))}}catch(e){}return null}

// ================= Вещи =================
const RAR=[{n:'Обычная',c:'#cfcfcf'},{n:'Редкая',c:'#5ab0ff'},{n:'Эпическая',c:'#c48aff'},{n:'Легендарная',c:'#ffc04a'},{n:'Мифическая',c:'#ff5a4a'}];
const SLOTN={weapon:'Оружие',armor:'Одежда',helmet:'Голова',acc:'Аксессуар'};
const SLOTS=['weapon','armor','helmet','acc'];
const KINDS={
  weapon:{sword:['Короткий меч','Стальной меч','Рунный клинок','Клинок заката'],axe:['Топорик','Боевой топор','Секира бури','Секира предков'],
    mace:['Дубина','Булава','Звёздная булава','Молот грома'],spear:['Копьё','Пика стражи','Копьё молний','Копьё зари'],
    bow:['Охотничий лук','Длинный лук','Лук ветров','Лук Звездопада'],crossbow:['Арбалет','Тяжёлый арбалет','Арбалет-гром','Арбалет Возмездия'],
    staff:['Посох ученика','Посох мага','Посох бури','Посох Первозданного'],
    hoe:['Мотыга','Добрая мотыга','Мотыга урожая','Мотыга Плодородия'],hammer:['Молоток','Кузнечный молот','Молот мастера','Молот Горна'],scales:['Весы','Купеческие весы','Весы удачи','Весы Изобилия']},
  armor:{leather:['Кожаная куртка','Дублёная куртка','Куртка следопыта','Куртка теней'],mail:['Кольчуга','Двойная кольчуга','Мифриловая кольчуга','Кольчуга феникса'],
    plate:['Нагрудник','Латы стража','Латы рыцаря','Латы рассвета'],robe:['Ряса','Мантия','Мантия чародея','Мантия Звёзд'],
    smock:['Рубаха','Крепкая рубаха','Рубаха пахаря','Рубаха Жатвы'],apron:['Фартук','Кожаный фартук','Фартук мастера','Фартук Горна'],coat:['Кафтан','Купеческий кафтан','Кафтан гильдии','Кафтан Златоуста']},
  helmet:{hood:['Кожаный капюшон','Капюшон охотника','Капюшон ночи','Капюшон звездочёта'],helm:['Шлем','Шлем дозорного','Крылатый шлем','Шлем победы'],
    great:['Глухой шлем','Закрытый шлем','Шлем паладина','Шлем-корона'],
    straw:['Соломенная шляпа','Широкая шляпа','Шляпа урожая','Шляпа Солнца'],goggles:['Очки','Кузнечные очки','Очки мастера','Очки Пламени'],beret:['Берет','Бархатный берет','Берет гильдии','Берет Златоуста']},
  acc:{ring:['Медное кольцо','Серебряное кольцо','Кольцо силы','Кольцо Драконов'],amulet:['Оберег','Амулет','Амулет стойкости','Амулет Предков'],
    cloak:['Плащ','Дорожный плащ','Плащ сумерек','Плащ Феникса'],charm:['Талисман','Счастливый талисман','Талисман мастерства','Талисман Изобилия']}
};
const KINFO={sword:{t:'melee',m:1},axe:{t:'melee',m:1.15},mace:{t:'melee',m:1.1},spear:{t:'melee',m:1.05},bow:{t:'ranged',m:.95},crossbow:{t:'ranged',m:1.2},staff:{t:'magic',m:.8},
  hoe:{bon:'farm'},hammer:{bon:'craft'},scales:{bon:'trade'},smock:{bon:'farm'},apron:{bon:'craft'},coat:{bon:'trade'},straw:{bon:'farm'},goggles:{bon:'craft'},beret:{bon:'trade'},charm:{bon:'any'},
  leather:{m:.8},mail:{m:1},plate:{m:1.25},robe:{m:.6},hood:{m:.8},helm:{m:1},great:{m:1.2},ring:{},amulet:{},cloak:{}};
const WORK_KINDS=['hoe','hammer','scales','smock','apron','coat','straw','goggles','beret','charm'];
const SKI={farm:'🌾',trade:'💼',craft:'🔨'};
function mkItem(s,slot,kind,r,lvl){
  const I=KINFO[kind]||{},pw=(1+lvl*.35)*[1,1.7,2.8,4.5,7.2][r]*(I.m||1),R=Math.round;
  const it={id:++s.iid,slot,kind,r,lvl,name:KINDS[slot][kind][Math.min(r,3)]+(r===4?' ✦':''),atk:0,hp:0};
  if(I.bon){it.bon={sk:I.bon==='any'?rnd(['farm','trade','craft']):I.bon,pct:R([10,18,28,45,70][r]*(slot==='weapon'||slot==='armor'?1:.6)*(1+lvl*.05))}}
  else if(slot==='weapon'){it.atk=R(5*pw)}
  else if(kind==='robe'){it.hp=R(16*pw);it.atk=R(2.5*pw)}
  else if(slot==='armor'){it.hp=R(30*pw)}
  else if(slot==='helmet'){it.hp=R(14*pw);if(r>=2)it.atk=R(1.5*pw)}
  else if(kind==='ring'){it.atk=R(3*pw)}
  else if(kind==='amulet'){it.hp=R(20*pw)}
  else if(kind==='cloak'){it.hp=R(12*pw);it.atk=R(1.5*pw)}
  if(r>=2&&slot==='weapon'&&!I.bon)it.hp=R(8*pw);
  s.items.push(it);return it;
}
function rollRar(boost=0){const w=[60-boost*4,28+boost*1.5,10+boost*1.8,2+boost*.7,.3+boost*.22].map(x=>Math.max(.2,x));let x=Math.random()*w.reduce((a,b)=>a+b);for(let i=0;i<5;i++){if((x-=w[i])<0)return i}return 0}
function rollSpec(pool,boost){
  const work=pool==='work'||(pool==='any'&&Math.random()<.3);
  for(;;){const slot=rnd(work?['weapon','armor','helmet','acc']:['weapon','weapon','armor','helmet','acc']);
    const ks=Object.keys(KINDS[slot]).filter(k=>work?WORK_KINDS.includes(k):!WORK_KINDS.includes(k));
    if(ks.length)return {slot,kind:rnd(ks),r:rollRar(boost)}}
}
function randItem(lvl,boost,pool='combat'){const z=rollSpec(pool,boost);return mkItem(S,z.slot,z.kind,z.r,lvl)}
const item=id=>id==null?null:S.items.find(i=>i.id===id);
const owner=it=>S.people.find(p=>p.eq&&p.eq[it.slot]===it.id);
function gearStats(p){let atk=0,hp=0;for(const k in p.eq){const it=item(p.eq[k]);if(it){atk+=it.atk;hp+=it.hp}}return {atk,hp}}
function workBonus(p,sk){let b=0;for(const k in p.eq){const it=item(p.eq[k]);if(it&&it.bon&&it.bon.sk===sk)b+=it.bon.pct}return b}
const wtype=p=>{const w=item(p.eq.weapon);return w&&KINFO[w.kind].t||'melee'};
const sellPrice=it=>Math.round(25*Math.pow(2.4,it.r)*(1+it.lvl*.3));
const statTxt=it=>[it.atk?`⚔️${it.atk}`:'',it.hp?`❤️${it.hp}`:'',it.bon?`${SKI[it.bon.sk]}+${it.bon.pct}%`:''].filter(Boolean).join(' ');
const TYPEN={melee:'ближний бой',ranged:'стрелок',magic:'маг'};

// ================= Экономика =================
const room=id=>S.rooms.find(r=>r.id==id);
const floors=()=>Math.min(2+S.tower,8);
const storeCap=()=>Math.round(500*Math.pow(1.8,S.tower-1));
const maxPeople=()=>2+S.tower+S.rooms.filter(r=>r.t==='bunk').reduce((a,r)=>a+2+r.lvl,0);
const crew=r=>S.people.filter(p=>p.room===r.id);
const slotsOf=r=>T[r.t].skill?Math.min(T[r.t].w+r.lvl-1,6):0;
const slots=slotsOf;
const capOf=r=>Math.round(T[r.t].cap*Math.pow(1.6,r.lvl-1));
function neighbors(r){
  const w=T[r.t].w;
  return S.rooms.filter(o=>o!==r&&o.t===r.t&&(
    (o.f===r.f&&(o.c+T[o.t].w===r.c||r.c+w===o.c))||
    (Math.abs(o.f-r.f)===1&&o.c<r.c+w&&r.c<o.c+T[o.t].w))).length;
}

// ================= Действия =================
function collect(r){const got=Math.floor(r.stock);if(!got)return 0;const k=T[r.t].res;
  const take=Math.max(0,Math.min(got,storeCap()-S.res[k]));S.res[k]+=take;r.stock-=take;stat(k,take);return take}
function collectAll(){const sum={};S.rooms.forEach(r=>{if(T[r.t].res){const g=collect(r);if(g)sum[T[r.t].res]=(sum[T[r.t].res]||0)+g}});
  toast(Object.keys(sum).length?'Собрано: '+Object.keys(sum).map(k=>RES[k].i+'+'+sum[k]).join(' '):'Пока нечего собирать');save();render()}
function collectRoom(id,e){if(e)e.stopPropagation();const r=room(id);const g=collect(r);toast(g?`${RES[T[r.t].res].i} +${g}`:'Склад полон — улучши Башню');save();render()}
function upgrade(id){const r=room(id);if(r.lvl>=S.tower+1){toast('Сначала улучши Башню старосты');return}
  const c=upCost(r);if(!canPay(c)){toast('Не хватает ресурсов');return}
  pay(c);r.lvl++;stat('ups');addLog(`⬆️ ${T[r.t].n} теперь ур. ${r.lvl}`);toast(`${T[r.t].n}: уровень ${r.lvl}!`);save();render();openRoom(id)}
function upTower(){const c=towerCost();if(!canPay(c)){toast('Не хватает ресурсов');return}
  pay(c);S.tower++;stat('towers');addLog(`🏰 Башня старосты ур. ${S.tower}${floors()<8?': новый этаж!':''}`);toast('Башня улучшена!');save();render();openHall()}
function build(t,f,c){const cost=buildCost(t);if(!canPay(cost)){toast('Не хватает ресурсов');return}
  if(!fits(f,c,T[t].w)){toast('Не помещается');return}
  pay(cost);addRoom(S,t,f,c);stat('builds');addLog(`🔨 Построено: ${T[t].n}`);toast(`Построено: ${T[t].n}`);closeM();save();render()}
function startMove(id){moving=id;closeM();tab='castle';render();toast('Выбери подсвеченное место')}
function placeMove(f,c){const r=room(moving);if(!fits(f,c,T[r.t].w,r.id)){toast('Сюда не помещается');return}
  r.f=f;r.c=c;moving=null;toast('Комната переставлена');save();render()}
function assign(pid,rid){const p=S.people.find(x=>x.id==pid);if(!p)return;rid=rid==='none'?null:+rid;
  if(rid){const r=room(rid);if(crew(r).length>=slots(r)&&p.room!==rid){toast('В комнате нет мест');render();return}}
  p.room=rid;save();render()}
function recruit(paid){if(S.people.length>=maxPeople()){toast('Нет места — построй или улучши Спальню');return}
  if(paid){const c={gold:100*S.people.length};if(!canPay(c)){toast('Нужно '+fmtCost(c));return}pay(c)}
  else{if(Date.now()<S.nextRecruit)return;S.nextRecruit=Date.now()+60*60e3}
  const d=newDweller();S.people.push(d);stat('recruits');addLog(`🚪 В крепость пришёл новый житель: ${d.name}`);toast(`Новый житель: ${d.name}!`);save();render()}
function addLog(t){S.log.unshift(new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})+' '+t);S.log=S.log.slice(0,40)}

function waveOf(stage){const w=WAVES[stage%WAVES.length],loop=Math.floor(stage/WAVES.length),m=Math.pow(2.4,loop);
  return {n:w.n+(loop?' +'+loop:''),boss:w.boss,loop,units:w.u.map(k=>({k,n:EN[k].n,hp:Math.round(EN[k].hp*m),atk:Math.round(EN[k].atk*m),t:EN[k].t,sz:EN[k].k}))}}

function fighterStats(p,b=1){const g=gearStats(p);return {hp:Math.round((30+p.sk.fight*8+p.lvl*6+g.hp)*b),atk:Math.round((p.sk.fight*2+p.lvl+g.atk)*b),t:wtype(p)}}
function fighters(){const out=[];S.rooms.filter(r=>r.t==='guard').forEach(r=>{const b=1+.25*(r.lvl-1);crew(r).forEach(p=>out.push({p,b}))});return out}
function armyPower(){let hp=0,atk=0;const f=fighters();f.forEach(({p,b})=>{const s=fighterStats(p,b);hp+=s.hp;atk+=s.atk});return {hp,atk,n:f.length,list:f}}
const HPOS=[[42,10],[29,10],[16,10],[36,58],[23,58],[10,58]];

  const fs=foes.map((u,i)=>{const [x,b]=HPOS[i]||[3,52],big=EN[u.k].wide,f=b<30||big,k=EN[u.k].k*(f?1:.85);return `<div class="unit e" id="u${u.id}" style="right:${big?18:x}%;bottom:${big?8:b}px;z-index:${f?3:2};width:${big?150:56}px;height:${big?130:80}px"><div class="hpb e"><div style="width:${u.hp/u.max*100}%"></div></div><div class="spr">${chr(u.k,'idle',k,-1,-1,'c'+u.id)}</div></div>`}).join('');

  Object.assign(B,{heroes,foes,w,turn:0,speed:B.speed||1,over:false});
  openM(`<div class="row"><b class="grow" style="font-size:17px">⚔️ ${w.n}</b><button class="act sec" id="spd" onclick="B.speed=B.speed===1?2:1;this.textContent='×'+B.speed">×${B.speed}</button></div>

function center(el,ar){const r=el.getBoundingClientRect(),a=ar.getBoundingClientRect();return {x:r.left-a.left+r.width/2,y:r.top-a.top+r.height*.45}}
function projectile(from,to,kind,dur){const ar=document.getElementById('arena');if(!ar)return;const a=center(unitEl(from),ar),b=center(unitEl(to),ar);
  const d=document.createElement('div');d.className='proj';const ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
  d.innerHTML=kind==='magic'?`<svg width="22" height="22" viewBox="-11 -11 22 22"><circle r="10" fill="url(#rg${from.side==='h'?2:1})"/><circle r="4.4" fill="${from.side==='h'?'#e0c0ff':'#7aff9a'}"/><circle r="2" fill="#fff"/></svg>`
    :kind==='fire'?`<svg width="34" height="22" viewBox="-17 -11 34 22"><ellipse rx="16" ry="8" fill="url(#glowR)"/><ellipse rx="8" ry="5" fill="url(#fire)"/></svg>`
    :`<svg width="30" height="8" viewBox="-15 -4 30 8"><path d="M-14 0H10" stroke="#8a6a3a" stroke-width="1.6"/><path d="M14 0l-5-3v6z" fill="#c9ccd4"/><path d="M-14 0l-3-3M-14 0l-3 3M-11 0l-3-3M-11 0l-3 3" stroke="#e8e2cc" stroke-width="1"/></svg>`;
  d.style.left=a.x+'px';d.style.top=a.y+'px';d.style.transform=`translate(-50%,-50%) rotate(${ang}deg)`;d.style.transition=`left ${dur}ms linear,top ${dur}ms linear`;
  ar.appendChild(d);requestAnimationFrame(()=>requestAnimationFrame(()=>{d.style.left=b.x+'px';d.style.top=b.y+'px'}));setTimeout(()=>d.remove(),dur+30)}
function hitUnit(u,dmg,crit){u.hp=Math.max(0,u.hp-dmg);const el=unitEl(u);if(!el)return;
  el.querySelector('.hpb div').style.width=u.hp/u.max*100+'%';const sp=el.querySelector('.spr');sp.classList.remove('hit');void sp.offsetWidth;sp.classList.add('hit');
  const ar=document.getElementById('arena'),c=center(el,ar),f=document.createElement('div');f.className='dmg'+(u.side==='h'?' bad':'')+(crit?' crit':'');f.textContent=(crit?'КРИТ! ':'')+'-'+dmg;
  f.style.left=(c.x-14)+'px';f.style.top=(c.y-30)+'px';ar.appendChild(f);setTimeout(()=>f.remove(),850);
  if(u.hp<=0){const ce=document.getElementById('c'+u.id);clearTimeout(ce&&ce._t);setTimeout(()=>{setAnim(ce,'die');el.classList.add('dead')},200)}}
function battleStep(){
  if(B.over||!document.getElementById('arena'))return;
  const order=[];const H=alive(B.heroes),F=alive(B.foes);const n=Math.max(H.length,F.length);
  for(let i=0;i<n;i++){if(H[i])order.push(H[i]);if(F[i])order.push(F[i])}
  const actor=order[B.turn%order.length];B.turn++;
  const enemies=actor.side==='h'?alive(B.foes):alive(B.heroes);if(!enemies.length)return endBattle();
  const sp=B.speed,el=unitEl(actor),spr=el.querySelector('.spr');
  let targets;if(actor.t==='magic')targets=enemies;else if(actor.t==='ranged')targets=[rnd(enemies)];else targets=[enemies[0]];
  const isH=actor.side==='h';
  const ce=document.getElementById('c'+actor.id);setAnim(ce,isH?(actor.t==='melee'?rnd(['attack','attack2']):'attack2'):'attack','idle');
  if(actor.t==='melee'){el.classList.add('step');setTimeout(()=>el.classList.remove('step'),600/sp)}
  const delay=(actor.t==='melee'?330:420)/sp;
  setTimeout(()=>{
    if(actor.t!=='melee')targets.forEach(t=>projectile(actor,t,actor.k==='dragon'?'fire':actor.t==='magic'?'magic':'arrow',260/sp));
    setTimeout(()=>{targets.forEach(t=>{let d=Math.round(actor.atk*(.85+Math.random()*.3)*(actor.t==='magic'?.55:1));const crit=Math.random()<.1;if(crit)d=Math.round(d*1.6);hitUnit(t,Math.max(1,d),crit)});
      if(!alive(B.foes).length||!alive(B.heroes).length)setTimeout(endBattle,500/sp);else setTimeout(battleStep,320/sp)},actor.t==='melee'?0:260/sp);
  },delay);
}
function endBattle(){if(B.over)return;B.over=true;const win=!alive(B.foes).length,w=B.w;
  const fr=document.getElementById('fres'),btn=document.getElementById('fclose');if(!fr)return;btn.disabled=false;
  if(win){const tot=w.units.reduce((a,u)=>a+u.hp,0);const loot={food:Math.round(tot*.4),ore:Math.round(tot*.25)};
    for(const k in loot)S.res[k]=Math.min(storeCap(),S.res[k]+loot[k]);
    B.heroes.forEach(u=>gainXp(u.p,20+S.stage*5));S.stage++;stat('wins');
    fr.innerHTML=`🏆 Победа! Добыча: ${fmtCost(loot)}`;addLog(`🏆 Разбиты: ${w.n}`);btn.textContent='🎁 К сундукам';save();btn.onclick=()=>openLoot({hp:tot,boss:w.boss})}
  else{fr.textContent='Отряд отступил. Надень снаряжение, прокачай воинов или улучши Караульню.';addLog(`💀 Поражение: ${w.n}`);btn.textContent='Готово';save();btn.onclick=()=>{closeM();render()}}}

// ---- Сундуки ----
const TIERS=[{n:'Деревянный',b:'url(#wood)',m:'#5a5e68',item:.35,boost:0,mul:1},{n:'Железный',b:'#4a3424',m:'url(#silver)',item:.6,boost:3,mul:1.6},{n:'Королевский',b:'url(#purple)',m:'url(#gold)',item:1,boost:7,mul:2.6}];
function chestSvg(t){const T_=TIERS[t];
  return `<svg viewBox="0 -24 80 94"><ellipse cx="40" cy="66" rx="34" ry="5" fill="#000" opacity=".35"/>
  <g class="shine"><circle cx="40" cy="28" r="44" fill="url(#glow)"/></g>
  <rect x="9" y="27" width="62" height="8" fill="#1a0f08"/><ellipse class="shine" cx="40" cy="30" rx="27" ry="6" fill="url(#gold)"/>
  <rect x="6" y="30" width="68" height="34" rx="4" fill="${T_.b}" stroke="${O}" stroke-width="1.2"/><path d="M8 40h64M8 52h64" stroke="#000" stroke-opacity=".2"/>
  <rect x="13" y="30" width="6" height="34" fill="${T_.m}" stroke="${O}" stroke-width=".6"/><rect x="61" y="30" width="6" height="34" fill="${T_.m}" stroke="${O}" stroke-width=".6"/>
  <rect x="33" y="34" width="14" height="14" rx="2.5" fill="${T_.m}" stroke="${O}" stroke-width=".8"/><circle cx="40" cy="40" r="2" fill="${O}"/><path d="M40 41v4" stroke="${O}" stroke-width="2"/>
  ${t===2?'<circle cx="24" cy="47" r="2.6" fill="#6fe0ff" stroke="#fff" stroke-width=".5"/><circle cx="56" cy="47" r="2.6" fill="#e2453c" stroke="#fff" stroke-width=".5"/>':''}
  <g class="lid"><path d="M6 31V22Q6 6 40 6T74 22V31z" fill="${T_.b}" stroke="${O}" stroke-width="1.2"/><path d="M12 14Q40 0 68 14" stroke="#fff" stroke-opacity=".25" fill="none" stroke-width="2"/>
   <path d="M13 31V11M19 31V9" stroke="${O}" stroke-opacity="0"/><rect x="13" y="9" width="6" height="22" fill="${T_.m}" stroke="${O}" stroke-width=".6"/><rect x="61" y="9" width="6" height="22" fill="${T_.m}" stroke="${O}" stroke-width=".6"/>
   <rect x="34" y="24" width="12" height="7" rx="2" fill="${T_.m}" stroke="${O}" stroke-width=".7"/></g></svg>`}
let LOOT=null;
function openLoot(e){
  const x=Math.random()+S.stage*.03,tier=e.boss?2:x>1.1?2:x>.7?1:0,T_=TIERS[tier];
  const prizes=[0,1,2].map(()=>({coins:Math.round(e.hp*(.6+Math.random()*.9)*T_.mul),item:Math.random()<T_.item?rollSpec('any',T_.boost+S.stage*.3):null}));
  LOOT={prizes,picked:null,lvl:Math.floor(S.stage/2)};
  openM(`<h2 style="margin-top:0;text-align:center">🎁 ${T_.n} сундук</h2><p class="sub" style="text-align:center">Выбери один из трёх — внутри монеты и, может быть, вещь</p>
  <div class="chests">${[0,1,2].map(i=>`<div class="chest idle" id="ch${i}" onclick="pickChest(${i})">${chestSvg(tier)}<div class="prize" id="pz${i}"></div></div>`).join('')}</div>
  <div id="lootres"></div><button class="act" style="width:100%;padding:14px;margin-top:8px;display:none" id="lootok" onclick="closeM();render()">Забрать</button>`);
}
function prizeTxt(z){return `<span style="color:var(--gold)">🪙${fmt(z.coins)}</span>${z.item?`<br><span class="r${z.item.r}">${(KINDS[z.item.slot][z.item.kind][Math.min(z.item.r,3)]+(z.item.r===4?' ✦':''))}</span>`:''}`}
function burstCoins(el){const svg=el.querySelector('svg');let s='';for(let i=0;i<8;i++)s+=`<circle class="burst" style="--dx:${(i-3.5)*7}px;animation-delay:${i*.04}s" cx="40" cy="26" r="3.4" fill="url(#gold)" stroke="#a36d10" stroke-width=".6"/>`;svg.insertAdjacentHTML('beforeend',s)}
function pickChest(i){if(!LOOT||LOOT.picked!==null)return;LOOT.picked=i;
  document.querySelectorAll('.chest').forEach(c=>c.classList.remove('idle'));
  const el=document.getElementById('ch'+i);el.classList.add('shake');
  setTimeout(()=>{el.classList.remove('shake');el.classList.add('open');burstCoins(el);
    stat('chests');const z=LOOT.prizes[i];const room_=storeCap()-S.res.gold;const got=Math.max(0,Math.min(z.coins,room_));S.res.gold+=got;
    let html=`<p style="text-align:center;font-weight:800">+🪙${fmt(got)}${got<z.coins?' <span class="sub">(склад полон)</span>':''}</p>`;
    if(z.item){const it=mkItem(S,z.item.slot,z.item.kind,z.item.r,LOOT.lvl);html+=itemCard(it,'Новая вещь!');addLog(`🎁 Из сундука: ${it.name}`)}
    document.getElementById('pz'+i).innerHTML=prizeTxt(z);document.getElementById('lootres').innerHTML=html;save();header();
    setTimeout(()=>{[0,1,2].filter(j=>j!==i).forEach(j=>{const c=document.getElementById('ch'+j);c.classList.add('open','missed');document.getElementById('pz'+j).innerHTML=prizeTxt(LOOT.prizes[j])});
      document.getElementById('lootok').style.display=''},700)},520)}
function itemCard(it,title){return `<div class="itemcard"><div class="icon b${it.r}">${itemIcon(it)}</div><div style="flex:1"><div class="sub">${title||SLOTN[it.slot]}</div><b class="r${it.r}">${it.name}</b><div class="stats">${RAR[it.r].n} · ${statTxt(it)}</div></div></div>`}

// ---- Кузня: ковка ----
const craftCost=r=>({ore:Math.round(50*Math.pow(1.45,r.lvl-1)),gold:Math.round(40*Math.pow(1.45,r.lvl-1))});
function craft(id,pool='combat'){const r=room(id),c=craftCost(r);if(!canPay(c)){toast('Нужно '+fmtCost(c));return}
  if(!crew(r).length){toast('В Кузне нет мастеров');return}
  pay(c);const sk=crew(r).reduce((a,p)=>a+p.sk.craft,0);const it=randItem(Math.floor(S.stage/2)+r.lvl-1,(r.lvl-1)*2+sk*.3,pool);stat('crafts');
  addLog(`⚒️ Выкована вещь: ${it.name}`);save();header();
  openM(`<h2 style="margin-top:0">⚒️ Кузня выковала</h2>${itemCard(it)}<div class="row" style="margin-top:10px"><button class="act" style="flex:1" onclick="craft(${id},'${pool}')">Ещё раз: ${fmtCost(c)}</button><button class="act sec" onclick="tab='items';syncTabs();closeM();render()">В сумку</button></div>`)}

// ---- Экипировка ----
function equip(iid,pid){const it=item(iid),p=S.people.find(x=>x.id==pid);if(!it||!p)return;
  const prev=owner(it);if(prev)prev.eq[it.slot]=null;p.eq[it.slot]=it.id;stat('equips');toast(`${p.name}: ${it.name}`);save();render()}
function unequip(pid,slot){const p=S.people.find(x=>x.id==pid);if(p){p.eq[slot]=null;save();render()}}
function sell(iid){const it=item(iid);if(!it||owner(it))return;const pr=sellPrice(it);S.res.gold=Math.min(storeCap(),S.res.gold+pr);S.items=S.items.filter(x=>x!==it);toast(`Продано: +🪙${pr}`);save();render()}
function openSlot(pid,slot){const p=S.people.find(x=>x.id==pid);const cur=item(p.eq[slot]);
  const list=S.items.filter(i=>i.slot===slot&&i!==cur).sort((a,b)=>(b.atk+b.hp)-(a.atk+a.hp));
  openM(`<div class="row"><b class="grow" style="font-size:17px">${SLOTN[slot]} для ${p.name}</b><button class="act sec" onclick="closeM()">✕</button></div>
  ${cur?itemCard(cur,'Надето')+`<button class="act sec" style="margin-top:6px" onclick="unequip(${p.id},'${slot}');closeM()">Снять</button>`:''}
  <h2>В сумке</h2>${list.length?list.map(it=>{const o=owner(it);return `<div class="opt"><div class="icon b${it.r}">${itemIcon(it)}</div><div style="flex:1;min-width:0"><b class="r${it.r}">${it.name}</b><div class="stats">${statTxt(it)}${o?` · <span class="sub">у ${o.name}</span>`:''}</div></div><button class="act" onclick="equip(${it.id},${p.id});closeM()">Надеть</button></div>`}).join(''):'<p class="sub">Пусто. Вещи выпадают из сундуков после боя и куются в Кузне.</p>'}`)}
function gainXp(p,x){p.xp+=x;while(p.xp>=p.lvl*50){p.xp-=p.lvl*50;p.lvl++;const k=rnd(Object.keys(p.sk));p.sk[k]++;addLog(`⭐ ${p.name} достиг ур. ${p.lvl}`)}}
function train(id){const p=S.people.find(x=>x.id==id);const c={food:40*p.lvl};
  if(!canPay(c)){toast('Нужно '+fmtCost(c));return}pay(c);gainXp(p,50);stat('trains');toast(`${p.name} потренировался`);save();render()}

// ================= Окна =================
function openM(html){document.getElementById('mbox').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeM(){document.getElementById('modal').classList.remove('show')}
function tapRoom(id){if(moving){if(moving===id){moving=null;render()}else toast('Выбери пустое подсвеченное место');return}openRoom(id)}
function tapEmpty(f,c){if(moving){placeMove(f,c);return}openBuild(f,c)}
function openRoom(id){
  const r=room(id),t=T[r.t],c=upCost(r),cr=crew(r),nb=neighbors(r);
  let info='';
  if(t.res)info=`<p>${RES[t.res].i} ${fmt(rate(r))}/ч · накоплено ${fmt(r.stock)}/${fmt(capOf(r))}${nb?` · <span style="color:var(--green)">соседи +${nb*15}%</span>`:''}</p>`;
  if(r.t==='bunk')info=`<p>Даёт ${2+r.lvl} мест для жителей.</p>`;
  if(r.t==='guard')info=`<p>Бонус к силе воинов: +${(r.lvl-1)*25}%</p>`;
  const free=S.people.filter(p=>p.room!==r.id);
  const workers=t.skill?`<h2>Работники ${cr.length}/${slots(r)}</h2>`+cr.map(p=>`<div class="opt"><div style="width:40px;height:56px;position:relative;flex:none">${portrait(p,.32)}</div><div style="flex:1"><b>${p.name}</b> <span class="pill">ур. ${p.lvl}</span><div class="sub">${SKILLS[t.skill]} ${p.sk[t.skill]}</div></div><button class="act sec" onclick="assign(${p.id},'none');openRoom(${id})">✕</button></div>`).join('')+
    (cr.length<slots(r)&&free.length?`<select onchange="assign(this.value,${id});openRoom(${id})"><option>＋ Поставить жителя…</option>${free.sort((a,b)=>b.sk[t.skill]-a.sk[t.skill]).map(p=>`<option value="${p.id}">${p.name} — ${SKILLS[t.skill]} ${p.sk[t.skill]}${p.room?' (занят)':''}</option>`).join('')}</select>`:''):'';
  openM(`<div class="opt" style="padding:0;overflow:hidden;height:96px;position:relative">${art(r.t,t.w*100,r.lvl)}</div>
  <div class="row"><div class="grow"><b style="font-size:17px">${t.i} ${t.n}</b> <span class="pill">ур. ${r.lvl}</span><div class="sub">${t.d} · этаж ${r.f+1}</div></div><button class="act sec" onclick="closeM()">✕</button></div>
  ${info}<div class="row" style="flex-wrap:wrap">${t.res?`<button class="act" onclick="collectRoom(${id});openRoom(${id})">Собрать</button>`:''}
  <button class="act sec" onclick="upgrade(${id})" ${canPay(c)&&r.lvl<=S.tower?'':'disabled'}>⬆️ Ур. ${r.lvl+1}: ${fmtCost(c)}</button>
  <button class="act sec" onclick="startMove(${id})">↔️ Переставить</button>${r.t==='forge'?`<button class="act" onclick="craft(${id})">⚔️ Оружие/броня: ${fmtCost(craftCost(r))}</button><button class="act" onclick="craft(${id},'work')">🧰 Для рабочих: ${fmtCost(craftCost(r))}</button>`:''}</div>${workers}`);
}
function openHall(){const c=towerCost();

  <div class="row"><div class="grow"><b style="font-size:17px">🏰 Башня старосты</b> <span class="pill">ур. ${S.tower}</span><div class="sub">Сердце крепости</div></div><button class="act sec" onclick="closeM()">✕</button></div>

// ================= Ходьба жителей =================
const WK={};
function walkLoop(){
  document.querySelectorAll('.walker').forEach(el=>{
    const id=el.dataset.id,w=+el.dataset.w,ce=el.firstElementChild;
    let s=WK[id];if(!s)s=WK[id]={x:6+Math.random()*78,dir:Math.random()<.5?1:-1,wait:rand(120),sp:.06+Math.random()*.06,act:0,an:'idle'};
    if(s.act>0){s.act--;if(s.look&&(s.act===50||s.act===20))s.dir*=-1}
    let want;
    if(s.wait>0){s.wait--;want='idle'}
    else{want='walk';s.x+=s.dir*s.sp/w;if(s.x>88||s.x<6){s.dir*=-1;s.x=Math.max(6,Math.min(88,s.x))}
      if(Math.random()<.005){s.wait=90+rand(160);want='idle';
        if(Math.random()<.6){if(Math.random()<.7){s.act=70;s.look=0;setAnim(ce,'attack','idle');s.an='attack'}else{s.act=80;s.look=1}}}}
    if(s.act<=0&&s.an!==want){s.an=want;setAnim(ce,want)}
    el.style.left=s.x+'%';ce.style.setProperty('--f',s.dir*(SPRM[ce.dataset.ch].face?1:-1));
  });
  requestAnimationFrame(walkLoop);
}
function walker(p,w){const s=WK[p.id];return `<div class="walker" data-id="${p.id}" data-w="${w}" style="left:${s?s.x:50}%">${chr(p.model,s?s.an==='walk'?'walk':'idle':'idle',.36,s?s.dir:1,maxRar(p))}</div>`}

// ================= Экраны =================
function header(){questTick();document.getElementById('lvl').textContent='· башня ур. '+S.tower;const cap=fmt(storeCap());
  document.getElementById('res').innerHTML=Object.keys(RES).map(k=>`<span class="chip">${k==='gold'?'<img src="assets/ui/i_coin.png" alt="">':RES[k].i} ${fmt(S.res[k])}<i>/${cap}</i></span>`).join('')+`<span class="chip">👥 ${S.people.length}<i>/${maxPeople()}</i></span>`}
let lastScroll=null;
function render(){
  questInit();tick(Date.now());header();
  const sc=document.querySelector('.scroller');if(sc)lastScroll=sc.scrollLeft;
  const v=document.getElementById('view');
  v.innerHTML=tab==='castle'?castleView():tab==='people'?peopleView():tab==='raid'?raidView():tab==='items'?itemsView():tab==='quests'?questsView():menuView();
  const ns=document.querySelector('.scroller');if(ns)ns.scrollLeft=lastScroll===null?0:lastScroll;
}
function refresh(){tick(Date.now());header();
  document.querySelectorAll('.stock[data-rid]').forEach(el=>{const r=room(el.dataset.rid);if(!r)return;const v=Math.floor(r.stock);
    el.style.display=v>=1?'':'none';el.lastChild.textContent=fmt(v);el.classList.toggle('ready',r.stock>=capOf(r)*.3)})}
function roomCell(r){
  const t=T[r.t],cr=crew(r),nb=neighbors(r);
  const st=t.res?`<div class="stock ${r.stock>=capOf(r)*.3?'ready':''}" data-rid="${r.id}" style="${r.stock>=1?'':'display:none'}" onclick="collectRoom(${r.id},event)">${RES[t.res].i}<span>${fmt(r.stock)}</span></div>`:'';
  return `<div class="cell ${moving===r.id?'moving':''}" style="grid-column:${r.c+2}/span ${t.w}" onclick="tapRoom(${r.id})">${art(r.t,t.w*100,r.lvl)}
    <div class="lbl${t.res?'':' wide'}">${t.n} <span class="lv">${r.lvl}</span>${nb?` <span class="bn">+${nb*15}%</span>`:''}</div>${st}
    ${cr.map(p=>walker(p,t.w)).join('')}${slots(r)?`<div class="slots">👤${cr.length}/${slots(r)}</div>`:''}</div>`;
}
function castleView(){
  const g=grid();let rows='';const mv=moving?room(moving):null;
  const FW=26*2+92*COLS+3*(COLS+1);
  for(let f=floors()-1;f>=0;f--){
    let cells=`<div class="side" style="grid-column:1">${sideArt(f)}</div>`;
    for(let c=0;c<COLS;c++){const id=g[f][c];
      if(id!==null){const r=room(id);if(r.c===c)cells+=roomCell(r);continue}
      const tg=mv&&fits(f,c,T[mv.t].w,mv.id)?'target':'';
      cells+=`<div class="cell empty ${tg}" style="grid-column:${c+2}/span 1" onclick="tapEmpty(${f},${c})">${emptyArt()}<div class="plus"><b>${tg?'⬇':'＋'}</b>${tg?'сюда':'строить'}</div></div>`;
    }
    cells+=`<div class="side" style="grid-column:${COLS+2}">${sideArt(f+1)}</div>`;
    rows+=`<div class="floor">${cells}</div>`;
  }
  return (mv?`<div class="movebar"><span style="flex:1">↔️ Куда поставить: ${T[mv.t].n}?</span><button class="act sec" onclick="moving=null;render()">Отмена</button></div>`:
    `<button class="act big" onclick="collectAll()">🧺 Собрать всё</button>`)+
  `<div class="scroller"><div class="scene">${skySvg()}${landSvg()}<div class="castle">${roofSvg(FW)}<div class="body">
    <div class="floor"><div class="side" style="grid-column:1">${sideArt(1)}</div><div class="cell" style="grid-column:2/span ${COLS}" onclick="moving?0:openHall()">${art('hall',COLS*100,S.tower)}<div class="lbl">Башня старосты <span class="lv">${S.tower}</span></div></div><div class="side" style="grid-column:${COLS+2}">${sideArt(0)}</div></div>
    ${rows}</div>${baseSvg(FW)}</div></div></div>
  <p class="sub hint">Нажми на комнату — улучшить, переставить, поставить жителей. Пустая клетка — стройка. Одинаковые комнаты рядом (сбоку или над/под) дают +15%. Замок можно листать вбок.</p>
  <h2>Летопись</h2><div class="log" style="margin:0 12px">${S.log.map(l=>`<div>${l}</div>`).join('')||'<div>Пока тихо…</div>'}</div>`;
}
const roomName=r=>`${T[r.t].i} ${T[r.t].n} (эт. ${r.f+1})`;
// ================= Квесты =================
function stat(k,n=1){S.st=S.st||{};S.st[k]=(S.st[k]||0)+n;questTick()}
const STORY=[
 {t:'Первый урожай',d:'Староста велит запасти еды к зиме. Собери 100 еды с Огорода.',k:'food',n:100,rw:{gold:80}},
 {t:'Монета к монете',d:'Казне нужны деньги на ремонт ворот. Собери 100 монет.',k:'gold',n:100,rw:{food:80}},
 {t:'Защитники стен',d:'Гоблины рыщут у болот. Отбей 1 набег.',k:'wins',n:1,rw:{gold:120,ore:40}},
 {t:'Стройка',d:'Крепости тесно. Построй новую комнату.',k:'builds',n:1,rw:{gold:150}},
 {t:'Горн разожжён',d:'Выкуй любую вещь в Кузне.',k:'crafts',n:1,rw:{ore:80,food:80}},
 {t:'В полной выкладке',d:'Надень снаряжение на жителей 3 раза.',k:'equips',n:3,rw:{gold:150}},
 {t:'Новые руки',d:'Прими в крепость нового жителя.',k:'recruits',n:1,rw:{food:200}},
 {t:'Мастерство',d:'Улучши комнаты 3 раза.',k:'ups',n:3,rw:{gold:250,ore:100}},
 {t:'Охотник за сокровищами',d:'Открой 3 сундука после побед.',k:'chests',n:3,rw:{item:{pool:'combat',boost:3}}},
 {t:'Выше стен',d:'Улучши Башню старосты.',k:'towers',n:1,rw:{gold:400}},
 {t:'Гроза тракта',d:'Разбойники перекрыли тракт. Победи ещё в 4 набегах.',k:'wins',n:4,rw:{item:{pool:'combat',boost:6}}},
 {t:'Щедрая земля',d:'Собери 2000 еды.',k:'food',n:2000,rw:{item:{pool:'work',boost:5}}},
 {t:'Учебный плац',d:'Проведи 5 тренировок.',k:'trains',n:5,rw:{gold:500}},
 {t:'Сердце горы',d:'Собери 1500 руды.',k:'ore',n:1500,rw:{gold:600}},
 {t:'Пепел и пламя',d:'Над долиной видели дракона. Пройди ещё 5 волн набегов.',k:'wins',n:5,rw:{item:{pool:'combat',boost:12}}},
 {t:'Золотой век',d:'Собери 10000 монет.',k:'gold',n:10000,rw:{item:{pool:'work',boost:12}}},
];
const DAILY_T=[{k:'food',t:'Полные амбары',n:l=>200*l},{k:'gold',t:'Торговый день',n:l=>150*l},{k:'ore',t:'Руда для горна',n:l=>100*l},
  {k:'wins',t:'Дозор',n:()=>2},{k:'crafts',t:'Работа кузнеца',n:()=>1},{k:'trains',t:'Учения',n:()=>2},{k:'chests',t:'Добыча',n:()=>2}];
const today=()=>new Date().toISOString().slice(0,10);
const st=k=>(S.st&&S.st[k])||0;
function questInit(){S.st=S.st||{};
  if(!S.q){S.q={i:0,base:st(STORY[0].k)}}
  if(!S.daily||S.daily.day!==today()){const pool=[...DAILY_T].sort(()=>Math.random()-.5).slice(0,3);
    S.daily={day:today(),list:pool.map(d=>({k:d.k,t:d.t,n:d.n(S.tower),base:st(d.k),done:false,rw:{gold:120*S.tower,food:60*S.tower}}))}}}
function qProg(k,n,base){return Math.min(n,st(k)-base)}
function claimable(){let c=0;const q=STORY[S.q.i];if(q&&qProg(q.k,q.n,S.q.base)>=q.n)c++;S.daily.list.forEach(d=>{if(!d.done&&qProg(d.k,d.n,d.base)>=d.n)c++});return c}
function questTick(){const b=document.getElementById('qbadge');if(b&&S.daily){const c=claimable();b.textContent=c;b.style.display=c?'':'none'}}
function giveRw(rw){const out=[];for(const k of ['food','gold','ore'])if(rw[k]){S.res[k]=Math.min(storeCap(),S.res[k]+rw[k]);out.push(RES[k].i+rw[k])}
  let it=null;if(rw.item){it=randItem(Math.floor(S.stage/2)+1,rw.item.boost,rw.item.pool);out.push(it.name)}return {txt:out.join(' '),it}}
function rwTxt(rw){return [...['food','gold','ore'].filter(k=>rw[k]).map(k=>RES[k].i+rw[k]),rw.item?(rw.item.pool==='work'?'🧰 вещь для рабочих':'🎁 боевая вещь'):''].filter(Boolean).join(' ')}
function claimStory(){const q=STORY[S.q.i];if(!q||qProg(q.k,q.n,S.q.base)<q.n)return;const r=giveRw(q.rw);S.q.i++;const nq=STORY[S.q.i];if(nq)S.q.base=st(nq.k);
  addLog(`📜 Задание «${q.t}» выполнено`);save();render();if(r.it)openM(`<h2 style="margin-top:0">📜 Награда</h2>${itemCard(r.it,'Новая вещь!')}<button class="act" style="width:100%;margin-top:10px" onclick="closeM()">Отлично</button>`);else toast('Награда: '+r.txt)}
function claimDaily(i){const d=S.daily.list[i];if(d.done||qProg(d.k,d.n,d.base)<d.n)return;d.done=true;const r=giveRw(d.rw);toast('Награда: '+r.txt);save();render()}
function questsView(){
  const q=STORY[S.q.i];
  const story=q?(()=>{const pr=qProg(q.k,q.n,S.q.base),ok=pr>=q.n;return `<div class="card quest"><div class="sub">Сюжет · глава ${S.q.i+1}/${STORY.length}</div><b style="font-size:16px">${q.t}</b><p style="margin:4px 0 8px">${q.d}</p>
    <div class="bar"><div style="width:${pr/q.n*100}%;background:var(--gold)"></div></div><div class="row" style="margin-top:6px"><span class="sub grow">${fmt(Math.max(0,pr))}/${fmt(q.n)} · награда: ${rwTxt(q.rw)}</span>
    <button class="act" onclick="claimStory()" ${ok?'':'disabled'}>Забрать</button></div></div>`})():`<div class="card"><b>Сюжет пройден!</b><p class="sub">Новые главы — в следующих обновлениях.</p></div>`;
  return story+`<h2>Задания дня</h2>`+S.daily.list.map((d,i)=>{const pr=qProg(d.k,d.n,d.base),ok=pr>=d.n;return `<div class="card"><div class="row"><b class="grow">${d.done?'✅ ':''}${d.t}</b><span class="pill">${{food:'🥕 собрать',gold:'🪙 собрать',ore:'⛏️ собрать',wins:'⚔️ победы',crafts:'⚒️ ковка',trains:'🏋️ тренировки',chests:'🎁 сундуки'}[d.k]}</span></div>
    <div class="bar"><div style="width:${Math.min(100,pr/d.n*100)}%;background:var(--green)"></div></div><div class="row" style="margin-top:6px"><span class="sub grow">${fmt(Math.max(0,pr))}/${fmt(d.n)} · ${rwTxt(d.rw)}</span>
    ${d.done?'<span class="pill">получено</span>':`<button class="act" onclick="claimDaily(${i})" ${ok?'':'disabled'}>Забрать</button>`}</div></div>`}).join('')+`<p class="sub hint">Новые задания дня появляются каждые сутки.</p>`;
}

// ================= Экраны: жители, вещи, набеги =================
function slotBtns(p){return `<div class="slotrow">${SLOTS.map(sl=>{const it=item(p.eq[sl]);
  return `<div class="slot ${it?'b'+it.r:''}" onclick="openSlot(${p.id},'${sl}')">${it?itemIcon(it)+`<span class="r${it.r}" style="font-size:9px;line-height:1.1">${statTxt(it)}</span>`:`<b style="font-size:20px;opacity:.5">＋</b>${SLOTN[sl]}`}</div>`}).join('')}</div>`}
function peopleView(){
  const left=S.nextRecruit-Date.now();
  const free=left<=0?`<button class="act" onclick="recruit(false)">Позвать</button>`:`<span class="pill">бесплатно через ${Math.ceil(left/60e3)} мин</span>`;
  const work=S.rooms.filter(r=>T[r.t].skill);
  const opts=p=>`<option value="none">— отдыхает —</option>`+work.map(r=>`<option value="${r.id}" ${p.room===r.id?'selected':''}>${roomName(r)} ${crew(r).length}/${slots(r)}</option>`).join('');
  return `<div class="card row"><span class="grow">Новые жители</span>${free}<button class="act sec" onclick="recruit(true)">🪙${100*S.people.length}</button></div>`+
  S.people.map(p=>{const fs=fighterStats(p),bon=['farm','trade','craft'].map(k=>workBonus(p,k)?`${SKI[k]}+${workBonus(p,k)}%`:'').filter(Boolean).join(' ');
  return `<div class="card"><div class="row" style="align-items:flex-start"><div class="portrait">${portrait(p,.48)}</div>
  <div class="grow" style="min-width:0"><b>${p.name}</b> <span class="pill">ур. ${p.lvl}</span>
  <div class="bar"><div style="width:${p.xp/(p.lvl*50)*100}%"></div></div>
  <div class="stats">⚔️ ${fs.atk} · ❤️ ${fs.hp} · <span class="sub">${TYPEN[fs.t]}</span>${bon?`<br><span style="color:var(--green)">${bon} к работе</span>`:''}</div>
  <div class="sub" style="margin-top:3px">${Object.keys(p.sk).map(k=>SKILLS[k]+' '+p.sk[k]).join(' · ')}</div>
  <button class="act sec" style="margin-top:6px;padding:6px 10px" onclick="train(${p.id})">🏋️ Тренировать 🥕${40*p.lvl}</button></div></div>
  ${slotBtns(p)}<select onchange="assign(${p.id},this.value)">${opts(p)}</select></div>`}).join('');
}
function itemsView(){
  const list=[...S.items].sort((a,b)=>b.r-a.r||(b.atk+b.hp)-(a.atk+a.hp));
  const fg=S.rooms.find(r=>r.t==='forge');
  return `<div class="card"><b>🎒 Сумка</b> <span class="pill">${list.length} вещ.</span><p class="sub">Вещи падают из сундуков, даются за задания и куются в Кузне. Боевые усиливают воинов, рабочие — производство (🌾 еда, 💼 монеты, 🔨 руда).</p>
  ${fg?`<div class="row"><button class="act" style="flex:1" onclick="craft(${fg.id})">⚔️ Выковать боевую</button><button class="act" style="flex:1" onclick="craft(${fg.id},'work')">🧰 Для рабочих</button></div><p class="sub" style="margin:6px 0 0">Цена: ${fmtCost(craftCost(fg))}</p>`:''}</div>`+
  (list.length?list.map(it=>{const o=owner(it);return `<div class="card row"><div class="icon b${it.r}">${itemIcon(it)}</div>
   <div style="flex:1;min-width:0"><b class="r${it.r}">${it.name}</b><div class="stats">${SLOTN[it.slot]} · ${statTxt(it)}</div><div class="sub">${o?'Надето: '+o.name:RAR[it.r].n}</div>
   <select onchange="if(this.value)equip(${it.id},this.value)"><option value="">${o?'Передать…':'Надеть на…'}</option>${S.people.filter(p=>p!==o).map(p=>`<option value="${p.id}">${p.name} (${SKILLS[mainSkill(p)].split(' ')[0]})</option>`).join('')}</select></div>
   ${o?`<button class="act sec" onclick="unequip(${o.id},'${it.slot}')">Снять</button>`:`<button class="act sec" onclick="sell(${it.id})">🪙${sellPrice(it)}</button>`}</div>`}).join(''):'<p class="sub hint">Пока пусто.</p>');
}
function raidView(){const w=waveOf(S.stage),a=armyPower();
  const heroes=a.list.slice(0,6).map(({p,b},i)=>{const s=fighterStats(p,b);return {id:'ph'+i,side:'h',p,hp:s.hp,max:s.hp,t:s.t}}).sort((x,y)=>(x.t==='melee'?0:1)-(y.t==='melee'?0:1));
  const foes=w.units.map((u,i)=>({id:'pe'+i,side:'e',k:u.k,hp:u.hp,max:u.hp,sz:u.sz}));
  return `<div class="card"><div style="text-align:center"><div class="sub">Волна ${S.stage+1}${w.boss?' · 👑 БОСС':''}</div><b style="font-size:17px">${w.n}</b></div>
  ${arenaHtml(heroes,foes)}
  <div class="row" style="flex-wrap:wrap;gap:4px;justify-content:center">${w.units.map(u=>`<span class="pill">${u.n}: ❤️${u.hp} ⚔️${u.atk} · ${TYPEN[u.t]}</span>`).join('')}</div>
  <p style="text-align:center">Твой отряд: ${a.n} воин. · ❤️ ${a.hp} · ⚔️ ${a.atk}</p>
  <button class="act" style="width:100%;padding:14px" onclick="fight()">⚔️ В бой</button></div>
  <div class="card sub">Воины — жители в Караульнях (до 6 в бою). Ближний бой стоит впереди, стрелки и маги сзади. Маг бьёт по всем врагам сразу, стрелок — по случайной цели, мечник — по первому в строю. После победы — сундук.</div>`}
function menuView(){
  return `<div class="card"><b>Как играть</b><p class="sub">Комнаты работают, даже когда игра закрыта. Заходи вечером, собирай урожай, строй и переставляй комнаты, отбивай набеги. Склад общий и ограничен уровнем Башни старосты.</p></div>
  <div class="card"><b>Сохранение</b><p class="sub">Прогресс хранится в этом браузере. Скопируй код, чтобы не потерять его или перенести.</p>
  <textarea id="code" readonly>${btoa(unescape(encodeURIComponent(JSON.stringify(S))))}</textarea>
  <div class="row" style="margin-top:6px"><button class="act sec" onclick="copyCode()">Скопировать</button><button class="act sec" onclick="importCode()">Загрузить код…</button></div></div>
  <div class="card"><b>Авторы графики</b><p class="sub" style="line-height:1.5">
  Герои и дракон — akylrum, «Knight, Princess and Dragon 2» (CC0).<br>
  Рыцарь, искательница, зомби, тыквоголовый, интерфейс — pzUH: «The Knight», «Adventurer Girl», «The Zombie», «Jack o' Lantern», «Free Fantasy Game GUI» (CC0).<br>
  Скелет, голем, вампир, упырь — irmirx: «Skeleton/Golem/Vampire/Zombie animations», лицензия <a href="https://creativecommons.org/licenses/by/3.0/" style="color:var(--gold)">CC-BY 3.0</a>.<br>
  Все наборы — <a href="https://opengameart.org" style="color:var(--gold)">opengameart.org</a>. Замок, комнаты и предметы нарисованы для этой игры.</p></div>
  <div class="card"><button class="act sec" onclick="askReset()">Начать заново</button></div>`}
function copyCode(){const t=document.getElementById('code');navigator.clipboard.writeText(t.value).then(()=>toast('Скопировано'),()=>{t.select();toast('Выдели и скопируй вручную')})}
function importCode(){openM(`<b>Вставь код сохранения</b><textarea id="imp"></textarea><div class="row" style="margin-top:8px"><button class="act" id="iok">Загрузить</button><button class="act sec" onclick="closeM()">Отмена</button></div>`);
  document.getElementById('iok').onclick=()=>{try{let s=JSON.parse(decodeURIComponent(escape(atob(document.getElementById('imp').value.trim()))));if(!s.res)throw 0;if(s.v!==3)s=fresh(s);S=normalize(s);questInit();save();closeM();toast('Загружено');render()}catch(e){toast('Код не подходит')}}}
function askReset(){openM(`<b>Точно начать заново?</b><p>Весь прогресс пропадёт.</p><div class="row"><button class="act" style="background:var(--red)" id="rok">Да</button><button class="act sec" onclick="closeM()">Нет</button></div>`);
  document.getElementById('rok').onclick=()=>{S=normalize(fresh());S.q=null;S.daily=null;questInit();save();closeM();render()}}
let tt;function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1800)}

// ================= Запуск =================
function syncTabs(){document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===tab))}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;syncTabs();render()});
S=load()||normalize(fresh());questInit();
const away=(Date.now()-S.last)/60e3;
render();walkLoop();
if(away>5)setTimeout(()=>toast(`С возвращением! Тебя не было ${away>90?Math.round(away/60)+' ч':Math.round(away)+' мин'} — урожай ждёт`),300);
setInterval(()=>{if(document.getElementById('modal').classList.contains('show'))return;
  if(tab==='castle')refresh();else if(tab!=='menu'&&!document.activeElement.matches('select'))render()},2000);
setInterval(save,10000);
addEventListener('visibilitychange',()=>{if(document.hidden)save();else refresh()});
</script>
</body>
</html>
