name: Dungeon Castle APK
on:
  push:
    paths: ['dungeon_castle/**', '.github/workflows/godot-apk.yml']
  workflow_dispatch:
env:
  GODOT_VERSION: 4.5.1
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Download Godot and export templates
        run: |
          V=${GODOT_VERSION}
          wget -q https://github.com/godotengine/godot/releases/download/$V-stable/Godot_v$V-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/$V-stable/Godot_v$V-stable_export_templates.tpz
          unzip -q Godot_v$V-stable_linux.x86_64.zip && mv Godot_v$V-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/$V.stable
          unzip -q Godot_v$V-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/$V.stable/
          rm -f *.tpz *.zip
      - name: Configure Android export
        run: |
          keytool -genkeypair -keystore $HOME/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.5.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.5.tres
      - name: Export APK
        working-directory: dungeon_castle
        run: |
          godot --headless --import || true
          mkdir -p ../build
          godot --headless --export-debug "Android" ../build/DungeonCastle.apk
          ls -la ../build
      - uses: actions/upload-artifact@v4
        with:
          name: dungeon-castle-apk
          path: build/DungeonCastle.apk
