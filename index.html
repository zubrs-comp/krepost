<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Вечерняя крепость</title>
<style>
:root{--bg:#1b1622;--panel:#2a2233;--panel2:#352b40;--ink:#f3e9d7;--dim:#b7a98f;--gold:#f2c14e;--green:#7bc67b;--red:#e06666;--blue:#6fa8dc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 50% -20%,#4a3560,#1b1622 60%);color:var(--ink);font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;padding-bottom:80px}
header{position:sticky;top:0;z-index:5;background:rgba(27,22,34,.95);backdrop-filter:blur(6px);padding:10px 12px;border-bottom:1px solid #3d3247}
h1{margin:0 0 6px;font-size:18px;letter-spacing:.5px}
h1 small{color:var(--dim);font-weight:400;font-size:12px}
.res{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel);border-radius:999px;padding:4px 10px;font-weight:600;font-size:14px}
.chip i{font-style:normal;color:var(--dim);font-weight:400;font-size:11px}
main{padding:12px;max-width:560px;margin:0 auto}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#140f19;border-top:1px solid #3d3247;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:0;color:var(--dim);padding:10px 0;font-size:12px}
.tabs button b{display:block;font-size:22px}
.tabs button.on{color:var(--gold)}
.castle{background:linear-gradient(#3b2f48,#2a2233);border:2px solid #4d3e5c;border-radius:14px;padding:8px;position:relative}
.roof{text-align:center;font-size:28px;margin:-4px 0 4px}
.room{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:10px;padding:10px;margin:6px 0;border-left:4px solid var(--c,#888)}
.room .ic{font-size:30px;width:38px;text-align:center}
.room .mid{flex:1;min-width:0}
.room .nm{font-weight:700}
.room .sub{color:var(--dim);font-size:12px}
.bar{height:6px;background:#1b1622;border-radius:3px;margin-top:5px;overflow:hidden}
.bar>div{height:100%;background:var(--c,#888);transition:width .3s}
.workers{font-size:18px;margin-top:3px;letter-spacing:2px}
button.act{background:var(--gold);color:#2a1e00;border:0;border-radius:10px;padding:9px 12px;font-weight:700;font-size:14px}
button.act.sec{background:#4d3e5c;color:var(--ink)}
button.act:disabled{opacity:.4}
.big{width:100%;padding:14px;font-size:16px;margin:10px 0}
.card{background:var(--panel);border-radius:12px;padding:12px;margin:8px 0}
.row{display:flex;align-items:center;gap:8px}
.row .grow{flex:1}
.pill{font-size:11px;background:#1b1622;border-radius:6px;padding:2px 6px;color:var(--dim)}
select{background:#1b1622;color:var(--ink);border:1px solid #4d3e5c;border-radius:8px;padding:6px}
.log{font-size:13px;color:var(--dim);max-height:220px;overflow:auto;background:#140f19;border-radius:10px;padding:8px}
.log div{margin:2px 0}
.toast{position:fixed;left:50%;top:90px;transform:translateX(-50%);background:var(--gold);color:#2a1e00;padding:10px 16px;border-radius:12px;font-weight:700;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal.show{display:flex}
.modal .box{background:var(--panel);border-radius:14px;padding:16px;max-width:420px;width:100%}
textarea{width:100%;height:110px;background:#140f19;color:var(--ink);border:1px solid #4d3e5c;border-radius:8px;padding:8px;font-size:12px}
.hp{height:8px;background:#140f19;border-radius:4px;overflow:hidden}
.hp>div{height:100%;transition:width .25s}
h2{font-size:16px;margin:14px 0 6px}
</style>
</head>
<body>
<header>
  <h1>🏯 Вечерняя крепость <small id="lvl"></small></h1>
  <div class="res" id="res"></div>
</header>
<main id="view"></main>
<nav class="tabs">
  <button data-t="castle" class="on"><b>🏯</b>Крепость</button>
  <button data-t="people"><b>🧑‍🌾</b>Жители</button>
  <button data-t="raid"><b>⚔️</b>Набеги</button>
  <button data-t="menu"><b>⚙️</b>Меню</button>
</nav>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>

<script>
// ===== Данные =====
const RES = {food:{n:'Еда',i:'🥕'},gold:{n:'Монеты',i:'🪙'},ore:{n:'Руда',i:'⛏️'}};
const ROOMS = {
  garden:{n:'Огород',i:'🥕',c:'#7bc67b',res:'food',skill:'farm',base:40,cap:400,cost:{gold:60}},
  treasury:{n:'Казна',i:'🪙',c:'#f2c14e',res:'gold',skill:'trade',base:30,cap:300,cost:{food:80}},
  forge:{n:'Кузня',i:'⚒️',c:'#e69138',res:'ore',skill:'craft',base:20,cap:200,cost:{food:60,gold:60}},
  guard:{n:'Караульня',i:'🛡️',c:'#6fa8dc',skill:'fight',cost:{gold:120,ore:60}},
  tower:{n:'Башня старосты',i:'🏰',c:'#b48ee0',cost:{food:200,gold:200,ore:120}},
};
const SKILLS = {farm:'🌾 Земледелие',trade:'💼 Торговля',craft:'🔨 Ремесло',fight:'🗡️ Бой'};
const FACES = ['🧑','👩','🧔','👱','👨‍🦰','👩‍🦱','🧓','👵'];
const NAMES = ['Ярема','Злата','Мирон','Велта','Остап','Ладимира','Гордей','Белава','Тихон','Рада','Добрыня','Веселина','Лука','Снежана','Ратибор','Олеся'];
const ENEMIES = [
  {n:'Болотные гоблины',i:'👺',hp:60,atk:6},{n:'Лесные разбойники',i:'🥷',hp:110,atk:10},
  {n:'Каменный тролль',i:'🗿',hp:220,atk:16},{n:'Стая варгов',i:'🐺',hp:320,atk:22},
  {n:'Тёмный колдун',i:'🧙',hp:480,atk:30},{n:'Пепельный дракон',i:'🐉',hp:800,atk:42}
];
const SPEED = 1; // множитель скорости производства (можно увеличить)

// ===== Состояние =====
let S;
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function newDweller(){
  const sk={farm:1+rand(4),trade:1+rand(4),craft:1+rand(4),fight:1+rand(4)};
  return {id:Date.now()+Math.random(),name:rnd(NAMES),face:rnd(FACES),lvl:1,xp:0,sk,room:null};
}
function rand(n){return Math.floor(Math.random()*n)}
function fresh(){
  const s={v:1,res:{food:150,gold:150,ore:40},stock:{garden:0,treasury:0,forge:0},
    lvl:{garden:1,treasury:1,forge:1,guard:1,tower:1},people:[],last:Date.now(),
    nextRecruit:Date.now()+30*60e3,stage:0,log:[]};
  for(let i=0;i<4;i++)s.people.push(newDweller());
  s.people[0].room='garden';s.people[1].room='treasury';s.people[2].room='forge';s.people[3].room='guard';
  return s;
}
function save(){S.last=Date.now();try{localStorage.setItem('vk_save',JSON.stringify(S))}catch(e){}}
function load(){try{const t=localStorage.getItem('vk_save');if(t)return JSON.parse(t)}catch(e){}return null}

// ===== Экономика =====
const capOf=r=>Math.round(ROOMS[r].cap*Math.pow(1.6,S.lvl[r]-1));
const slots=r=>Math.min(1+S.lvl[r],6);
const inRoom=r=>S.people.filter(p=>p.room===r);
function ratePerHour(r){
  const R=ROOMS[r];let w=inRoom(r).reduce((a,p)=>a+p.sk[R.skill]*(1+.15*(p.lvl-1)),0);
  return R.base*(1+.5*(S.lvl[r]-1))*(w/5)*SPEED;
}
const storeCap=()=>500*Math.pow(1.8,S.lvl.tower-1);
const maxPeople=()=>4+S.lvl.tower*2;
function tick(now){
  const dt=(now-S.last)/3600e3; if(dt<=0)return;
  for(const r of ['garden','treasury','forge'])S.stock[r]=Math.min(capOf(r),S.stock[r]+ratePerHour(r)*dt);
  S.last=now;
}
function upCost(r){const m=Math.pow(1.9,S.lvl[r]-1);const c={};for(const k in ROOMS[r].cost)c[k]=Math.round(ROOMS[r].cost[k]*m);return c}
function canPay(c){return Object.keys(c).every(k=>S.res[k]>=c[k])}
function pay(c){for(const k in c)S.res[k]-=c[k]}
const fmtCost=c=>Object.keys(c).map(k=>RES[k].i+c[k]).join(' ');
const fmt=n=>n>=1e4?(n/1e3).toFixed(1)+'к':Math.floor(n);

// ===== Действия =====
function collect(r){
  const got=Math.floor(S.stock[r]);if(!got)return 0;
  const k=ROOMS[r].res;const room=storeCap()-S.res[k];const take=Math.max(0,Math.min(got,room));
  S.res[k]+=take;S.stock[r]-=take;return take;
}
function collectAll(){
  let txt=[];for(const r of ['garden','treasury','forge']){const g=collect(r);if(g)txt.push(RES[ROOMS[r].res].i+'+'+g)}
  toast(txt.length?'Собрано: '+txt.join(' '):'Пока нечего собирать');save();render();
}
function upgrade(r){
  if(r!=='tower'&&S.lvl[r]>=S.lvl.tower+1){toast('Сначала улучши Башню старосты');return}
  const c=upCost(r);if(!canPay(c)){toast('Не хватает ресурсов');return}
  pay(c);S.lvl[r]++;addLog(`⬆️ ${ROOMS[r].n} теперь ур. ${S.lvl[r]}`);toast(`${ROOMS[r].n}: уровень ${S.lvl[r]}!`);save();render();
}
function assign(id,r){
  const p=S.people.find(x=>x.id==id);if(!p)return;
  if(r&&r!=='none'&&inRoom(r).length>=slots(r)&&p.room!==r){toast('В комнате нет мест');render();return}
  p.room=r==='none'?null:r;save();render();
}
function recruit(paid){
  if(S.people.length>=maxPeople()){toast('Нет места — улучши Башню');return}
  if(paid){const c={gold:100*S.people.length};if(!canPay(c)){toast('Нужно '+fmtCost(c));return}pay(c)}
  else{if(Date.now()<S.nextRecruit)return;S.nextRecruit=Date.now()+60*60e3}
  const d=newDweller();S.people.push(d);addLog(`🚪 В крепость пришёл ${d.face} ${d.name}`);toast(`Новый житель: ${d.name}!`);save();render();
}
function addLog(t){S.log.unshift(new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})+' '+t);S.log=S.log.slice(0,40)}

// ===== Бой =====
function armyPower(){
  const g=inRoom('guard');const b=1+.25*(S.lvl.guard-1);
  return {hp:Math.round(g.reduce((a,p)=>a+30+p.sk.fight*8+p.lvl*6,0)*b),atk:Math.round(g.reduce((a,p)=>a+p.sk.fight*2+p.lvl,0)*b),n:g.length};
}
function enemy(){const base=ENEMIES[S.stage%ENEMIES.length];const loop=Math.floor(S.stage/ENEMIES.length);const m=Math.pow(2.2,loop);
  return {...base,hp:Math.round(base.hp*m),atk:Math.round(base.atk*m),loop}}
function fight(){
  const a=armyPower();if(!a.n){toast('В Караульне нет воинов');return}
  const e=enemy();let ah=a.hp,eh=e.hp,rounds=[];
  while(ah>0&&eh>0&&rounds.length<40){eh-=Math.round(a.atk*(.8+Math.random()*.4));if(eh<=0)break;ah-=Math.round(e.atk*(.8+Math.random()*.4));rounds.push([ah,eh])}
  rounds.push([Math.max(0,ah),Math.max(0,eh)]);
  const win=eh<=0;
  showFight(a,e,rounds,win);
}
function showFight(a,e,rounds,win){
  const box=document.getElementById('mbox');
  box.innerHTML=`<h2 style="margin-top:0">⚔️ Набег: ${e.i} ${e.n}</h2>
  <div>🛡️ Твой отряд</div><div class="hp"><div id="ah" style="width:100%;background:var(--green)"></div></div>
  <div style="margin-top:8px">${e.i} Враг</div><div class="hp"><div id="eh" style="width:100%;background:var(--red)"></div></div>
  <p id="fres" style="font-weight:700;min-height:22px"></p><button class="act big" id="fclose" disabled>…</button>`;
  document.getElementById('modal').classList.add('show');
  let i=0;const iv=setInterval(()=>{
    const [ah,eh]=rounds[i];document.getElementById('ah').style.width=Math.max(0,ah/a.hp*100)+'%';document.getElementById('eh').style.width=Math.max(0,eh/e.hp*100)+'%';
    if(++i>=rounds.length){clearInterval(iv);
      const fr=document.getElementById('fres');const btn=document.getElementById('fclose');btn.disabled=false;btn.textContent='Готово';
      if(win){const loot={gold:Math.round(e.hp*.8),food:Math.round(e.hp*.5),ore:Math.round(e.hp*.3)};
        for(const k in loot)S.res[k]=Math.min(storeCap(),S.res[k]+loot[k]);
        inRoom('guard').forEach(p=>gainXp(p,20+S.stage*5));S.stage++;
        fr.textContent='Победа! Добыча: '+fmtCost(loot);addLog(`🏆 Разбиты: ${e.n}`)}
      else{fr.textContent='Отряд отступил. Прокачай воинов или Караульню.';addLog(`💀 Поражение: ${e.n}`)}
      save();btn.onclick=()=>{document.getElementById('modal').classList.remove('show');render()}}
  },180);
}
function gainXp(p,x){p.xp+=x;while(p.xp>=p.lvl*50){p.xp-=p.lvl*50;p.lvl++;const k=rnd(Object.keys(p.sk));p.sk[k]++;addLog(`⭐ ${p.name} достиг ур. ${p.lvl}`)}}
function train(id){
  const p=S.people.find(x=>x.id==id);const c={food:40*p.lvl};
  if(!canPay(c)){toast('Нужно '+fmtCost(c));return}pay(c);gainXp(p,50);toast(`${p.name} потренировался`);save();render();
}

// ===== Отрисовка =====
let tab='castle';
function render(){
  tick(Date.now());
  document.getElementById('lvl').textContent='· башня ур. '+S.lvl.tower;
  const cap=fmt(storeCap());
  document.getElementById('res').innerHTML=Object.keys(RES).map(k=>`<span class="chip">${RES[k].i} ${fmt(S.res[k])}<i>/${cap}</i></span>`).join('')+
    `<span class="chip">👥 ${S.people.length}<i>/${maxPeople()}</i></span>`;
  const v=document.getElementById('view');
  if(tab==='castle')v.innerHTML=castleView();
  if(tab==='people')v.innerHTML=peopleView();
  if(tab==='raid')v.innerHTML=raidView();
  if(tab==='menu')v.innerHTML=menuView();
}
function roomCard(r){
  const R=ROOMS[r];const c=upCost(r);const ppl=inRoom(r);
  let info='';
  if(R.res){const st=S.stock[r],cp=capOf(r);
    info=`<div class="sub">${RES[R.res].i} ${fmt(ratePerHour(r))}/ч · накоплено ${fmt(st)}/${fmt(cp)}</div><div class="bar"><div style="width:${st/cp*100}%"></div></div>`}
  else if(r==='guard'){const a=armyPower();info=`<div class="sub">❤️ ${a.hp} · 🗡️ ${a.atk}</div>`}
  else info=`<div class="sub">Склад ${fmt(storeCap())} · жителей до ${maxPeople()}</div>`;
  const w=r==='tower'?'':`<div class="workers">${ppl.map(p=>p.face).join('')}${'·'.repeat(Math.max(0,slots(r)-ppl.length))}</div>`;
  const btn=R.res&&S.stock[r]>=1?`<button class="act" onclick="collectOne('${r}')">Собрать</button>`:
    `<button class="act sec" onclick="upgrade('${r}')" ${canPay(c)?'':'disabled'}>⬆️<br><span style="font-size:11px">${fmtCost(c)}</span></button>`;
  return `<div class="room" style="--c:${R.c}"><div class="ic">${R.i}</div><div class="mid"><div class="nm">${R.n} <span class="pill">ур. ${S.lvl[r]}</span></div>${info}${w}</div>${btn}</div>`;
}
function collectOne(r){const g=collect(r);toast(g?`${RES[ROOMS[r].res].i} +${g}`:'Склад полон — улучши Башню');save();render()}
function castleView(){
  return `<button class="act big" onclick="collectAll()">🧺 Собрать всё</button>
  <div class="castle"><div class="roof">🚩 🏰 🚩</div>${['tower','guard','forge','treasury','garden'].map(roomCard).join('')}</div>
  <h2>Улучшения</h2><div class="card">${Object.keys(ROOMS).map(r=>{const c=upCost(r);return `<div class="row" style="margin:6px 0"><span class="grow">${ROOMS[r].i} ${ROOMS[r].n} → ур. ${S.lvl[r]+1}</span><button class="act sec" onclick="upgrade('${r}')" ${canPay(c)?'':'disabled'}>${fmtCost(c)}</button></div>`}).join('')}</div>
  <h2>Летопись</h2><div class="log">${S.log.map(l=>`<div>${l}</div>`).join('')||'<div>Пока тихо…</div>'}</div>`;
}
function peopleView(){
  const left=S.nextRecruit-Date.now();
  const free=left<=0?`<button class="act" onclick="recruit(false)">Позвать бесплатно</button>`:`<span class="pill">бесплатно через ${Math.ceil(left/60e3)} мин</span>`;
  const opts=r=>['none','garden','treasury','forge','guard'].map(k=>`<option value="${k}" ${(r||'none')===k?'selected':''}>${k==='none'?'— отдыхает —':ROOMS[k].i+' '+ROOMS[k].n}</option>`).join('');
  return `<div class="card row"><span class="grow">Новые жители</span>${free}<button class="act sec" onclick="recruit(true)">🪙${100*S.people.length}</button></div>`+
  S.people.map(p=>`<div class="card"><div class="row"><span style="font-size:30px">${p.face}</span><div class="grow"><b>${p.name}</b> <span class="pill">ур. ${p.lvl}</span>
  <div class="bar"><div style="width:${p.xp/(p.lvl*50)*100}%;background:var(--blue)"></div></div></div>
  <button class="act sec" onclick="train(${p.id})">🏋️ 🥕${40*p.lvl}</button></div>
  <div class="sub" style="margin:6px 0;color:var(--dim);font-size:12px">${Object.keys(p.sk).map(k=>SKILLS[k]+' '+p.sk[k]).join(' · ')}</div>
  <select onchange="assign(${p.id},this.value)">${opts(p.room)}</select></div>`).join('');
}
function raidView(){
  const e=enemy();const a=armyPower();
  return `<div class="card" style="text-align:center"><div style="font-size:56px">${e.i}</div><b>${e.n}${e.loop?' +'+e.loop:''}</b>
  <div class="sub" style="color:var(--dim)">❤️ ${e.hp} · 🗡️ ${e.atk}</div><p>Твой отряд: ${a.n} воин. · ❤️ ${a.hp} · 🗡️ ${a.atk}</p>
  <button class="act big" onclick="fight()">⚔️ В бой</button></div>
  <div class="card sub" style="color:var(--dim)">Воины — жители в Караульне. Сила зависит от навыка «Бой», уровня жителя и уровня Караульни. Пройдено волн: ${S.stage}.</div>`;
}
function menuView(){
  return `<div class="card"><b>Как играть</b><p class="sub" style="color:var(--dim)">Комнаты работают, даже когда игра закрыта. Заходи вечером, собирай урожай, улучшай комнаты и отбивай набеги. Склад общий и ограничен уровнем Башни старосты.</p></div>
  <div class="card"><b>Сохранение</b><p class="sub" style="color:var(--dim)">Прогресс хранится в этом браузере. Скопируй код, чтобы не потерять его или перенести.</p>
  <textarea id="code" readonly>${btoa(unescape(encodeURIComponent(JSON.stringify(S))))}</textarea>
  <div class="row" style="margin-top:6px"><button class="act sec" onclick="copyCode()">Скопировать</button><button class="act sec" onclick="importCode()">Загрузить код…</button></div></div>
  <div class="card"><button class="act sec" style="background:var(--red)" onclick="askReset()">Начать заново</button></div>`;
}
function copyCode(){const t=document.getElementById('code');navigator.clipboard.writeText(t.value).then(()=>toast('Скопировано'),()=>{t.select();toast('Выдели и скопируй вручную')})}
function importCode(){
  const box=document.getElementById('mbox');box.innerHTML=`<b>Вставь код сохранения</b><textarea id="imp"></textarea><div class="row" style="margin-top:8px"><button class="act" id="iok">Загрузить</button><button class="act sec" onclick="closeM()">Отмена</button></div>`;
  document.getElementById('modal').classList.add('show');
  document.getElementById('iok').onclick=()=>{try{const s=JSON.parse(decodeURIComponent(escape(atob(document.getElementById('imp').value.trim()))));if(!s.res)throw 0;S=s;save();closeM();toast('Загружено');render()}catch(e){toast('Код не подходит')}};
}
function askReset(){const box=document.getElementById('mbox');box.innerHTML=`<b>Точно начать заново?</b><p>Весь прогресс пропадёт.</p><div class="row"><button class="act" style="background:var(--red)" id="rok">Да</button><button class="act sec" onclick="closeM()">Нет</button></div>`;
  document.getElementById('modal').classList.add('show');document.getElementById('rok').onclick=()=>{S=fresh();save();closeM();render()}}
function closeM(){document.getElementById('modal').classList.remove('show')}
let tt;function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1800)}

// ===== Запуск =====
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));render()});
S=load()||fresh();
const away=(Date.now()-S.last)/60e3;
render();
if(away>5)setTimeout(()=>toast(`С возвращением! Тебя не было ${away>90?Math.round(away/60)+' ч':Math.round(away)+' мин'} — урожай ждёт`),300);
setInterval(()=>{if(!document.getElementById('modal').classList.contains('show')&&tab!=='menu')render()},2000);
setInterval(save,10000);
addEventListener('visibilitychange',()=>{if(document.hidden)save();else render()});
</script>
</body>
</html>
