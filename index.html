<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Вечерняя крепость</title>
<style>
:root{--bg:#1b1622;--panel:#2a2233;--panel2:#352b40;--ink:#f3e9d7;--dim:#b7a98f;--gold:#f2c14e;--green:#7bc67b;--red:#e06666;--blue:#6fa8dc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#1b1622;color:var(--ink);font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;padding-bottom:80px}
header{position:sticky;top:0;z-index:5;background:rgba(27,22,34,.95);backdrop-filter:blur(6px);padding:10px 12px;border-bottom:1px solid #3d3247}
h1{margin:0 0 6px;font-size:18px;letter-spacing:.5px}
h1 small{color:var(--dim);font-weight:400;font-size:12px}
.res{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel);border-radius:999px;padding:4px 10px;font-weight:600;font-size:14px}
.chip i{font-style:normal;color:var(--dim);font-weight:400;font-size:11px}
main{padding:12px 0;max-width:620px;margin:0 auto}
main>*:not(.scroller){margin-left:12px;margin-right:12px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#140f19;border-top:1px solid #3d3247;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:0;color:var(--dim);padding:10px 0;font-size:12px}
.tabs button b{display:block;font-size:22px}
.tabs button.on{color:var(--gold)}
button.act{background:linear-gradient(#ffd66b,#e9a92e);color:#2a1e00;border:0;border-radius:10px;padding:9px 12px;font-weight:800;font-size:14px;box-shadow:0 3px 0 #9a6a14}
button.act:active{transform:translateY(2px);box-shadow:0 1px 0 #9a6a14}
button.act.sec{background:linear-gradient(#5d4b6e,#463856);color:var(--ink);box-shadow:0 3px 0 #2a2133}
button.act:disabled{opacity:.4}
.big{width:calc(100% - 24px);padding:14px;font-size:16px;margin:4px 12px 12px}
.card{background:var(--panel);border-radius:12px;padding:12px;margin:8px 12px}
.row{display:flex;align-items:center;gap:8px}
.row .grow{flex:1}
.pill{font-size:11px;background:#1b1622;border-radius:6px;padding:2px 6px;color:var(--dim)}
.sub{color:var(--dim);font-size:12px}
select{background:#1b1622;color:var(--ink);border:1px solid #4d3e5c;border-radius:8px;padding:8px;max-width:100%;width:100%;margin-top:6px}
.log{font-size:13px;color:var(--dim);max-height:200px;overflow:auto;background:#140f19;border-radius:10px;padding:8px}
.log div{margin:2px 0}
.toast{position:fixed;left:50%;top:90px;transform:translateX(-50%);background:var(--gold);color:#2a1e00;padding:10px 16px;border-radius:12px;font-weight:700;z-index:40;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:30}
.modal.show{display:flex}
.modal .box{background:var(--panel);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-width:620px;width:100%;max-height:85vh;overflow:auto}
.modal .box .card{margin:8px 0}
textarea{width:100%;height:110px;background:#140f19;color:var(--ink);border:1px solid #4d3e5c;border-radius:8px;padding:8px;font-size:12px}
.hp{height:10px;background:#140f19;border-radius:5px;overflow:hidden}
.hp>div{height:100%;transition:width .25s}
.bar{height:6px;background:#1b1622;border-radius:3px;margin-top:5px;overflow:hidden}
.bar>div{height:100%;background:var(--blue)}
h2{font-size:16px;margin:14px 12px 6px}
.modal h2{margin:14px 0 6px}

/* ===== Сцена ===== */
.scroller{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scene{position:relative;width:max-content;min-width:100%;padding:0 16px;
  background:linear-gradient(#141238 0%,#2d2358 22%,#6a3d6e 52%,#c56a5a 78%,#e8a066 100%)}
.sky{position:absolute;left:0;right:0;top:0;height:260px;width:100%;pointer-events:none}
.land{position:absolute;left:0;right:0;bottom:0;height:260px;width:100%;pointer-events:none}
.cloud{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(760px)}}
.tw{animation:tw 2.5s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.castle{position:relative;margin:0 auto;width:max-content;padding-top:40px}
.roof,.base{display:block;width:100%;height:auto}
.roof{margin-bottom:-1px}.base{margin-top:-1px}
.body{background:#4b3f38;padding:0 0 0;display:flex;flex-direction:column}
.floor{display:grid;grid-template-columns:26px repeat(5,92px) 26px;column-gap:3px;padding:3px 0 0;background:#4b3f38;border-bottom:6px solid #6b4a2f;box-shadow:inset 0 -2px 0 #3e2817}
.side{position:relative;height:104px;background:#5f5047;
  background-image:repeating-linear-gradient(0deg,#4a3d35 0 2px,transparent 2px 13px),repeating-linear-gradient(90deg,transparent 0 12px,#54463d 12px 13px)}
.side svg{position:absolute;inset:0;width:100%;height:100%}
.cell{position:relative;height:104px;border-radius:2px;overflow:hidden;cursor:pointer;background:#2a1f1a}
.cell svg.art{position:absolute;inset:0;width:100%;height:100%}
.cell.empty .plus{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#c9b29a;font-size:11px;font-weight:700;text-shadow:0 1px 2px #000}
.cell.empty .plus b{font-size:24px;line-height:1;background:rgba(0,0,0,.35);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px dashed #c9b29a;margin-bottom:3px}
.cell.target{outline:3px solid var(--gold);outline-offset:-3px}
.cell.target .plus{color:var(--gold)}
.cell.target .plus b{border-color:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.cell.moving{filter:brightness(.5) saturate(.4)}
.lbl{position:absolute;left:4px;top:13px;background:rgba(20,15,25,.78);border-radius:6px;padding:1px 6px;font-size:10.5px;font-weight:700;white-space:nowrap;max-width:calc(100% - 52px);overflow:hidden;text-overflow:ellipsis;border:1px solid rgba(255,220,150,.25)}
.lbl.wide{max-width:calc(100% - 8px)}
.lbl .bn{color:#8fe08f}
.lbl .lv{color:var(--gold)}
.stock{position:absolute;right:4px;top:12px;background:linear-gradient(#fffaf0,#f1dfb4);color:#3a2a10;border-radius:12px;padding:2px 7px 2px 5px;font-size:12px;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.45);border:1.5px solid #c99a3c;z-index:2}
.stock.ready{animation:bounce 1.1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.walker{position:absolute;bottom:5px;z-index:1;pointer-events:none;transition:none}
.walker .flip{transform-origin:center}
.walker.idle svg{animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.5px)}}
.walker:not(.idle) .lg1{animation:step .32s infinite alternate}
.walker:not(.idle) .lg2{animation:step .32s infinite alternate-reverse}
.lg1,.lg2{transform-box:fill-box;transform-origin:top center}
@keyframes step{from{transform:rotate(22deg)}to{transform:rotate(-22deg)}}
.slots{position:absolute;right:5px;bottom:2px;font-size:10px;color:#fff;font-weight:700;text-shadow:0 1px 2px #000;z-index:2}
.flame{animation:flick .3s infinite alternate;transform-box:fill-box;transform-origin:center bottom}
@keyframes flick{to{transform:scaleY(.82) scaleX(1.08)}}
.flag{animation:wave 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
@keyframes wave{50%{transform:skewY(7deg) scaleX(.9)}}
.spark{animation:spark 1.2s linear infinite;transform-box:fill-box}
@keyframes spark{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),-26px);opacity:0}}
.twinkle{animation:twk 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twk{0%,100%{transform:scale(.2);opacity:0}50%{transform:scale(1);opacity:1}}
.glowp{animation:gp 2s ease-in-out infinite}
@keyframes gp{50%{opacity:.7}}
.movebar{position:sticky;top:82px;z-index:4;background:var(--gold);color:#2a1e00;border-radius:10px;padding:8px 12px;margin:0 12px 8px;display:flex;align-items:center;gap:8px;font-weight:700}
.opt{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:10px;padding:8px;margin:6px 0}
.opt .pv{height:52px;border-radius:6px;overflow:hidden;flex:none;position:relative;background:#2a1f1a}
.opt .pv svg{width:100%;height:100%}
.hint{margin:8px 12px}
/* ===== Снаряжение ===== */
.r0{color:#cfcfcf}.r1{color:#5ab0ff}.r2{color:#c48aff}.r3{color:#ffc04a}
.slotrow{display:flex;gap:6px;margin-top:8px}
.slot{flex:1;background:#1b1622;border:2px solid #4d3e5c;border-radius:10px;padding:4px;text-align:center;font-size:10px;color:var(--dim);min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.slot svg{width:38px;height:38px}
.slot.b1{border-color:#3a7ac0}.slot.b2{border-color:#8a4ad0}.slot.b3{border-color:#e0a030;box-shadow:0 0 10px rgba(255,180,50,.35)}
.icon{width:46px;height:46px;flex:none;border-radius:10px;background:radial-gradient(circle,#3d3150,#1b1622);border:2px solid #4d3e5c;display:flex;align-items:center;justify-content:center}
.icon svg{width:40px;height:40px}
.icon.b1{border-color:#3a7ac0}.icon.b2{border-color:#8a4ad0}.icon.b3{border-color:#e0a030}
.portrait{width:70px;height:96px;flex:none;border-radius:12px;background:radial-gradient(circle at 50% 70%,#4d3e5c,#1b1622);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.stats{font-size:12px;color:var(--ink);margin-top:3px}
/* ===== Арена ===== */
.arena{position:relative;height:190px;border-radius:12px;overflow:hidden;margin:8px 0;background:linear-gradient(#2a2038,#4a3548 60%,#6b4a2f 60%,#4a321e)}
.arena .team{position:absolute;bottom:18px;left:6px;display:flex;align-items:flex-end;gap:0;flex-wrap:wrap;max-width:58%}
.arena .team>div{margin-right:-6px}
.arena .foe{position:absolute;bottom:22px;right:14px;font-size:84px;line-height:1;filter:drop-shadow(0 6px 4px rgba(0,0,0,.5))}
.lunge{animation:lunge .35s}
@keyframes lunge{50%{transform:translateX(16px)}}
.lungeL{animation:lungeL .35s}
@keyframes lungeL{50%{transform:translateX(-22px) scale(1.08)}}
.hit{animation:hit .3s}
@keyframes hit{25%{transform:translateX(-5px);filter:brightness(2) drop-shadow(0 0 6px red)}75%{transform:translateX(5px)}}
.dmg{position:absolute;font-weight:900;font-size:20px;color:#ffe08a;text-shadow:0 2px 0 #000,0 0 6px #000;animation:up .8s forwards;pointer-events:none}
.dmg.bad{color:#ff7070}
@keyframes up{to{transform:translateY(-40px);opacity:0}}
/* ===== Сундуки ===== */
.chests{display:flex;justify-content:space-around;align-items:flex-end;margin:14px 0 6px;min-height:150px}
.chest{width:30%;text-align:center;cursor:pointer;position:relative}
.chest svg{width:100%;height:auto;overflow:visible}
.chest .lid{transition:transform .5s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:10% 100%}
.chest.open .lid{transform:translate(-4px,-10px) rotate(-28deg)}
.chest .shine{opacity:0;transition:opacity .4s}
.chest.open .shine{opacity:1}
.chest.idle{animation:wob 1.6s ease-in-out infinite}
.chest:nth-child(2).idle{animation-delay:.3s}.chest:nth-child(3).idle{animation-delay:.6s}
@keyframes wob{0%,100%{transform:rotate(0)}10%{transform:rotate(-4deg)}20%{transform:rotate(4deg)}30%{transform:rotate(0)}}
.chest.shake{animation:shk .5s}
@keyframes shk{20%{transform:rotate(-8deg) scale(1.05)}40%{transform:rotate(8deg) scale(1.1)}60%{transform:rotate(-6deg) scale(1.1)}80%{transform:rotate(4deg)}}
.chest.missed{opacity:.45;filter:grayscale(.6)}
.chest .prize{font-size:12px;font-weight:800;min-height:34px;margin-top:4px}
.burst{animation:burst .9s ease-out forwards;transform-box:fill-box}
@keyframes burst{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),-46px);opacity:0}}
.itemcard{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:12px;padding:10px;margin-top:8px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <pattern id="bricks" width="30" height="16" patternUnits="userSpaceOnUse">
      <rect width="30" height="16" fill="#9a8573"/>

    <radialGradient id="fire" cx=".5" cy=".9" r=".85"><stop offset="0" stop-color="#fff6c0"/><stop offset=".35" stop-color="#ffc040"/><stop offset=".75" stop-color="#f06a1c"/><stop offset="1" stop-color="#b32a10"/></radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd27a" stop-opacity=".6"/><stop offset=".5" stop-color="#ffb04a" stop-opacity=".18"/><stop offset="1" stop-color="#ffb04a" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowR" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff8a3a" stop-opacity=".75"/><stop offset="1" stop-color="#ff5a1a" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0a0"/><stop offset=".5" stop-color="#f2c14e"/><stop offset="1" stop-color="#b98118"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef1f6"/><stop offset=".5" stop-color="#9aa1ad"/><stop offset="1" stop-color="#5b6170"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a8703f"/><stop offset="1" stop-color="#6a4022"/></linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6e4526"/><stop offset="1" stop-color="#3b2212"/></linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d7884"/><stop offset="1" stop-color="#4c4852"/></linearGradient>
    <linearGradient id="winsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2d6a"/><stop offset=".6" stop-color="#c46a6a"/><stop offset="1" stop-color="#f3b06a"/></linearGradient>

    <pattern id="mail" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#8a909c"/><circle cx="1.5" cy="1.5" r="1.1" fill="none" stroke="#c9ced8" stroke-width=".55"/></pattern>

    <radialGradient id="rg1"><stop offset="0" stop-color="#5ab0ff" stop-opacity=".55"/><stop offset="1" stop-color="#5ab0ff" stop-opacity="0"/></radialGradient>

    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6fa"/><stop offset=".5" stop-color="#aab1bd"/><stop offset="1" stop-color="#6b7280"/></linearGradient>
    <linearGradient id="pillar" x1="0" x2="1"><stop offset="0" stop-color="#6e6676"/><stop offset=".4" stop-color="#b8b0bf"/><stop offset="1" stop-color="#5a5262"/></linearGradient>

<header>
  <h1>🏯 Вечерняя крепость <small id="lvl"></small></h1>
  <div class="res" id="res"></div>
</header>
<main id="view"></main>
<nav class="tabs">
  <button data-t="castle" class="on"><b>🏯</b>Крепость</button>
  <button data-t="people"><b>🧑‍🌾</b>Жители</button>
  <button data-t="items"><b>🎒</b>Вещи</button>
  <button data-t="raid"><b>⚔️</b>Набеги</button>

<div class="modal" id="modal" onclick="if(event.target===this)closeM()"><div class="box" id="mbox"></div></div>

<script>
// ================= Данные =================
const COLS=5;
const RES={food:{n:'Еда',i:'🥕'},gold:{n:'Монеты',i:'🪙'},ore:{n:'Руда',i:'⛏️'}};
const T={
  garden:  {n:'Огород',   i:'🥕',w:3,res:'food',skill:'farm', base:40,cap:300,build:{gold:60},         tint:'#2c4a1e',d:'Растит еду'},
  treasury:{n:'Казна',    i:'🪙',w:2,res:'gold',skill:'trade',base:30,cap:250,build:{food:80},         tint:'#5a4210',d:'Копит монеты'},
  forge:   {n:'Кузня',    i:'⚒️',w:2,res:'ore', skill:'craft',base:22,cap:180,build:{food:60,gold:60}, tint:'#4a1e14',d:'Даёт руду'},
  guard:   {n:'Караульня',i:'🛡️',w:3,skill:'fight',build:{gold:120,ore:40},tint:'#1e3050',d:'Тут живут воины'},
  bunk:    {n:'Спальня',  i:'🛏️',w:1,build:{food:100,gold:50},tint:'#3a2250',d:'+места для жителей'},
};
const SKILLS={farm:'🌾 Земледелие',trade:'💼 Торговля',craft:'🔨 Ремесло',fight:'🗡️ Бой'};
const SKCOL={farm:'#5aa64a',trade:'#d9a62a',craft:'#c8642a',fight:'#3f78c4'};
const SKIN=['#f7d6b8','#eab890','#c98e64','#8d5a3b'];
const HAIR=['#3a2516','#7a4a22','#e0bb5e','#b8442a','#2a2a2a','#e8e2d8'];
const NAMES=['Ярема','Злата','Мирон','Велта','Остап','Ладимира','Гордей','Белава','Тихон','Рада','Добрыня','Веселина','Лука','Снежана','Ратибор','Олеся'];

  {n:'Болотные гоблины',i:'👺',hp:60,atk:6},{n:'Лесные разбойники',i:'🥷',hp:110,atk:10},

let S,moving=null,tab='castle';

const NM=['Ярема','Мирон','Остап','Гордей','Тихон','Добрыня','Лука','Ратибор','Всеслав','Елисей','Богдан','Святогор'];
const NF=['Злата','Велта','Ладимира','Белава','Рада','Веселина','Снежана','Олеся','Милава','Дарина','Забава','Любава'];
const EYES=['#4a7ab0','#5a8a3a','#7a4a22','#3a2a1a','#6a6a7a'];
const PANTS=['#4a3a5a','#3a4a5a','#5a4a32','#3a3a3a','#5a3a32'];
function looks(p){if(p.g===undefined)p.g=NF.includes(p.name)?1:NM.includes(p.name)?0:rand(2);
  if(p.hs===undefined)p.hs=p.g?2+rand(3):rand(2);if(p.beard===undefined)p.beard=!p.g&&Math.random()<.45;
  if(p.eye===undefined)p.eye=rand(EYES.length);if(p.pants===undefined)p.pants=rand(PANTS.length);if(!p.eq)p.eq={weapon:null,armor:null,helmet:null};return p}
function newDweller(){const g=rand(2);return looks({id:Date.now()+Math.random(),g,name:rnd(g?NF:NM),skin:rand(SKIN.length),hair:rand(HAIR.length),lvl:1,xp:0,
  sk:{farm:1+rand(4),trade:1+rand(4),craft:1+rand(4),fight:1+rand(4)},room:null})}
function normalize(s){
  s.people.forEach(looks);
  if(!s.items){s.items=[];s.iid=0;
    const g=s.rooms.find(r=>r.t==='guard'),f=g&&s.people.find(p=>p.room===g.id)||s.people[0];
    if(f){const a=mkItem(s,'weapon','sword',0,0),b=mkItem(s,'armor','leather',0,0);f.eq.weapon=a.id;f.eq.armor=b.id}
    mkItem(s,'helmet','helm',0,0);
  }
  return s;
}
function mainSkill(p){return Object.keys(p.sk).reduce((a,k)=>p.sk[k]>p.sk[a]?k:a,Object.keys(p.sk)[0])}
function addRoom(s,t,f,c,lvl=1){const r={id:++s.nid,t,lvl,f,c,stock:0};s.rooms.push(r);return r}
function fresh(old){
  const s={v:3,nid:0,res:{food:150,gold:150,ore:40},tower:1,rooms:[],people:[],last:Date.now(),nextRecruit:Date.now()+30*60e3,stage:0,log:[],items:old&&old.items,iid:old&&old.iid};
  const R={garden:addRoom(s,'garden',0,0),treasury:addRoom(s,'treasury',0,3),forge:addRoom(s,'forge',1,0),bunk:addRoom(s,'bunk',1,2),guard:addRoom(s,'guard',2,0)};
  if(old&&old.res){
    s.res=old.res;s.stage=old.stage||0;s.log=old.log||[];s.tower=old.tower||(old.lvl&&old.lvl.tower)||1;s.nextRecruit=old.nextRecruit||s.nextRecruit;
    const typeOf=id=>{if(R[id])return id;const r=(old.rooms||[]).find(x=>x.id===id);return r?r.t:null};
    if(old.lvl)for(const k in R)if(old.lvl[k])R[k].lvl=old.lvl[k];
    (old.rooms||[]).forEach(r=>{if(R[r.t])R[r.t].lvl=Math.max(R[r.t].lvl,r.lvl)});
    s.people=(old.people||[]).map(p=>{const t=typeOf(p.room);return {...newDweller(),...p,room:t&&R[t]&&T[t].skill?R[t].id:null}});
    for(const k in R)while(s.people.filter(p=>p.room===R[k].id).length>slotsOf(R[k])){const p=s.people.find(p=>p.room===R[k].id);p.room=null}
    if(old.v!==3)s.log.unshift('🏗️ Крепость перестроена: теперь 5 клеток на этаже');
  }else{
    for(let i=0;i<4;i++)s.people.push(newDweller());
    [R.garden,R.treasury,R.forge,R.guard].forEach((r,i)=>s.people[i].room=r.id);
  }
  return s;
}
function save(){tick(Date.now());S.last=Date.now();try{localStorage.setItem('vk_save',JSON.stringify(S))}catch(e){}}
function load(){try{const t=localStorage.getItem('vk_save');if(t){const s=JSON.parse(t);return normalize(s.v===3?s:fresh(s))}}catch(e){}return null}

          spear:['Копьё','Пика стражи','Копьё молний','Копьё зари'],mace:['Дубина','Булава','Звёздная булава','Молот грома']},
  armor:{leather:['Кожаная куртка','Дублёная куртка','Куртка следопыта','Куртка теней'],mail:['Кольчуга','Двойная кольчуга','Мифриловая кольчуга','Кольчуга феникса'],
          plate:['Нагрудник','Латы стража','Латы рыцаря','Латы рассвета']},
  helmet:{hood:['Кожаный капюшон','Капюшон охотника','Капюшон ночи','Капюшон звездочёта'],helm:['Шлем','Шлем дозорного','Крылатый шлем','Шлем победы'],
          great:['Глухой шлем','Закрытый шлем','Шлем паладина','Шлем-корона']}
};
const KMUL={sword:1,axe:1.15,spear:.95,mace:1.1,leather:.8,mail:1,plate:1.25,hood:.8,helm:1,great:1.2};
function mkItem(s,slot,kind,r,lvl){
  const pw=(1+lvl*.35)*[1,1.7,2.8,4.5][r]*KMUL[kind];
  const it={id:++s.iid,slot,kind,r,lvl,name:KINDS[slot][kind][r],
    atk:slot==='weapon'?Math.round(5*pw):slot==='helmet'&&r>=2?Math.round(1.5*pw):0,
    hp:slot==='armor'?Math.round(30*pw):slot==='helmet'?Math.round(14*pw):r>=2?Math.round(8*pw):0};
  s.items.push(it);return it;
}
function rollRar(boost=0){const w=[60-boost*4,28+boost*1.5,10+boost*1.8,2+boost*.7];let x=Math.random()*w.reduce((a,b)=>a+b);for(let i=0;i<4;i++){if((x-=w[i])<0)return i}return 0}
function randItem(lvl,boost){const slot=rnd(['weapon','weapon','armor','helmet']);return mkItem(S,slot,rnd(Object.keys(KINDS[slot])),rollRar(boost),lvl)}
const item=id=>id==null?null:S.items.find(i=>i.id===id);
const owner=it=>S.people.find(p=>p.eq&&p.eq[it.slot]===it.id);
function gearStats(p){let atk=0,hp=0;for(const k in p.eq){const it=item(p.eq[k]);if(it){atk+=it.atk;hp+=it.hp}}return {atk,hp}}
const sellPrice=it=>Math.round(25*Math.pow(2.4,it.r)*(1+it.lvl*.3));
const statTxt=it=>[it.atk?`⚔️${it.atk}`:'',it.hp?`❤️${it.hp}`:''].filter(Boolean).join(' ');

const room=id=>S.rooms.find(r=>r.id==id);
const floors=()=>Math.min(2+S.tower,10);
const storeCap=()=>Math.round(500*Math.pow(1.8,S.tower-1));
const maxPeople=()=>2+S.tower+S.rooms.filter(r=>r.t==='bunk').reduce((a,r)=>a+2+r.lvl,0);
const crew=r=>S.people.filter(p=>p.room===r.id);
const slotsOf=r=>T[r.t].skill?Math.min(T[r.t].w+r.lvl-1,6):0;
const slots=slotsOf;
const capOf=r=>Math.round(T[r.t].cap*Math.pow(1.6,r.lvl-1));
function neighbors(r){
  const w=T[r.t].w;
  return S.rooms.filter(o=>o!==r&&o.t===r.t&&(
    (o.f===r.f&&(o.c+T[o.t].w===r.c||r.c+w===o.c))||
    (Math.abs(o.f-r.f)===1&&o.c<r.c+w&&r.c<o.c+T[o.t].w))).length;
}
const bonus=r=>1+.15*neighbors(r);
function rate(r){const t=T[r.t];if(!t.res)return 0;
  const w=crew(r).reduce((a,p)=>a+p.sk[t.skill]*(1+.15*(p.lvl-1)),0);
  return t.base*(1+.5*(r.lvl-1))*(w/5)*bonus(r)*SPEED}
function tick(now){const dt=(now-S.last)/3600e3;if(dt<=0)return;
  S.rooms.forEach(r=>{if(T[r.t].res)r.stock=Math.min(capOf(r),r.stock+rate(r)*dt)});S.last=now}
function scale(c,m){const o={};for(const k in c)o[k]=Math.round(c[k]*m);return o}
const buildCost=t=>scale(T[t].build,Math.pow(1.7,S.rooms.filter(r=>r.t===t).length));
const upCost=r=>scale(T[r.t].build,1.2*Math.pow(1.9,r.lvl));
const towerCost=()=>scale({food:200,gold:200,ore:120},Math.pow(1.9,S.tower-1));
const canPay=c=>Object.keys(c).every(k=>S.res[k]>=c[k]);
function pay(c){for(const k in c)S.res[k]-=c[k]}
const fmt=n=>n>=1e4?(n/1e3).toFixed(1)+'к':Math.floor(n);
const fmtCost=c=>Object.keys(c).map(k=>RES[k].i+fmt(c[k])).join(' ');
function grid(){const g=[];for(let f=0;f<floors();f++)g.push(Array(COLS).fill(null));
  S.rooms.forEach(r=>{for(let i=0;i<T[r.t].w;i++)if(g[r.f])g[r.f][r.c+i]=r.id});return g}
function fits(f,c,w,ignore){const g=grid();if(c+w>COLS||!g[f])return false;for(let i=0;i<w;i++){const x=g[f][c+i];if(x!==null&&x!==ignore)return false}return true}

// ================= Действия =================
function collect(r){const got=Math.floor(r.stock);if(!got)return 0;const k=T[r.t].res;
  const take=Math.max(0,Math.min(got,storeCap()-S.res[k]));S.res[k]+=take;r.stock-=take;return take}
function collectAll(){const sum={};S.rooms.forEach(r=>{if(T[r.t].res){const g=collect(r);if(g)sum[T[r.t].res]=(sum[T[r.t].res]||0)+g}});
  toast(Object.keys(sum).length?'Собрано: '+Object.keys(sum).map(k=>RES[k].i+'+'+sum[k]).join(' '):'Пока нечего собирать');save();render()}
function collectRoom(id,e){if(e)e.stopPropagation();const r=room(id);const g=collect(r);toast(g?`${RES[T[r.t].res].i} +${g}`:'Склад полон — улучши Башню');save();render()}
function upgrade(id){const r=room(id);if(r.lvl>=S.tower+1){toast('Сначала улучши Башню старосты');return}
  const c=upCost(r);if(!canPay(c)){toast('Не хватает ресурсов');return}
  pay(c);r.lvl++;addLog(`⬆️ ${T[r.t].n} теперь ур. ${r.lvl}`);toast(`${T[r.t].n}: уровень ${r.lvl}!`);save();render();openRoom(id)}
function upTower(){const c=towerCost();if(!canPay(c)){toast('Не хватает ресурсов');return}
  pay(c);S.tower++;addLog(`🏰 Башня старосты ур. ${S.tower}${floors()<10?': новый этаж!':''}`);toast('Башня улучшена!');save();render();openHall()}
function build(t,f,c){const cost=buildCost(t);if(!canPay(cost)){toast('Не хватает ресурсов');return}
  if(!fits(f,c,T[t].w)){toast('Не помещается');return}
  pay(cost);addRoom(S,t,f,c);addLog(`🔨 Построено: ${T[t].n}`);toast(`Построено: ${T[t].n}`);closeM();save();render()}
function startMove(id){moving=id;closeM();tab='castle';render();toast('Выбери подсвеченное место')}
function placeMove(f,c){const r=room(moving);if(!fits(f,c,T[r.t].w,r.id)){toast('Сюда не помещается');return}
  r.f=f;r.c=c;moving=null;toast('Комната переставлена');save();render()}
function assign(pid,rid){const p=S.people.find(x=>x.id==pid);if(!p)return;rid=rid==='none'?null:+rid;
  if(rid){const r=room(rid);if(crew(r).length>=slots(r)&&p.room!==rid){toast('В комнате нет мест');render();return}}
  p.room=rid;save();render()}
function recruit(paid){if(S.people.length>=maxPeople()){toast('Нет места — построй или улучши Спальню');return}
  if(paid){const c={gold:100*S.people.length};if(!canPay(c)){toast('Нужно '+fmtCost(c));return}pay(c)}
  else{if(Date.now()<S.nextRecruit)return;S.nextRecruit=Date.now()+60*60e3}
  const d=newDweller();S.people.push(d);addLog(`🚪 В крепость пришёл новый житель: ${d.name}`);toast(`Новый житель: ${d.name}!`);save();render()}
function addLog(t){S.log.unshift(new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})+' '+t);S.log=S.log.slice(0,40)}

// ================= Бой =================
function fighterStats(p,b=1){const g=gearStats(p);return {hp:Math.round((30+p.sk.fight*8+p.lvl*6+g.hp)*b),atk:Math.round((p.sk.fight*2+p.lvl+g.atk)*b)}}
function fighters(){const out=[];S.rooms.filter(r=>r.t==='guard').forEach(r=>{const b=1+.25*(r.lvl-1);crew(r).forEach(p=>out.push({p,b}))});return out}
function armyPower(){let hp=0,atk=0;const f=fighters();f.forEach(({p,b})=>{const s=fighterStats(p,b);hp+=s.hp;atk+=s.atk});return {hp,atk,n:f.length,list:f}}
function enemy(){const b=ENEMIES[S.stage%ENEMIES.length],loop=Math.floor(S.stage/ENEMIES.length),m=Math.pow(2.2,loop);return {...b,hp:Math.round(b.hp*m),atk:Math.round(b.atk*m),loop}}
function arena(a,e){return `<div class="arena"><svg style="position:absolute;inset:0;width:100%;height:100%" viewBox="0 0 300 190" preserveAspectRatio="none">
  <rect width="300" height="114" fill="url(#bricks)" opacity=".55"/><rect y="114" width="300" height="76" fill="url(#planks)"/><rect y="114" width="300" height="76" fill="#000" opacity=".25"/>
  ${torch(40,50)}${torch(260,50)}<rect width="300" height="190" fill="url(#vigH)"/></svg>
  <div class="team" id="team">${a.list.slice(0,6).map(({p})=>`<div>${person(p,40)}</div>`).join('')}</div><div class="foe" id="foe">${e.i}</div></div>`}
function fight(){const a=armyPower();if(!a.n){toast('Поставь жителей в Караульню');return}
  const e=enemy();let ah=a.hp,eh=e.hp;const steps=[];
  while(ah>0&&eh>0&&steps.length<60){let d=Math.round(a.atk*(.8+Math.random()*.4));eh-=d;steps.push({w:'a',d,ah,eh});if(eh<=0)break;
    d=Math.round(e.atk*(.8+Math.random()*.4));ah-=d;steps.push({w:'e',d,ah,eh})}
  showFight(a,e,steps,eh<=0)}
function floatDmg(host,txt,bad,x){const d=document.createElement('div');d.className='dmg'+(bad?' bad':'');d.textContent=txt;d.style.left=x+'%';d.style.top='40%';host.appendChild(d);setTimeout(()=>d.remove(),800)}
function showFight(a,e,steps,win){
  openM(`<h2 style="margin-top:0">⚔️ ${e.n}${e.loop?' +'+e.loop:''}</h2>${arena(a,e)}
  <div class="row sub"><span class="grow">🛡️ Отряд</span><span id="aht">${a.hp}</span></div><div class="hp"><div id="ah" style="width:100%;background:var(--green)"></div></div>
  <div class="row sub" style="margin-top:6px"><span class="grow">${e.i} Враг</span><span id="eht">${e.hp}</span></div><div class="hp"><div id="eh" style="width:100%;background:var(--red)"></div></div>
  <p id="fres" style="font-weight:800;min-height:22px;text-align:center"></p><button class="act" style="width:100%;padding:14px" id="fclose" disabled>Идёт бой…</button>`);
  const team=document.getElementById('team'),foe=document.getElementById('foe'),ar=document.querySelector('.arena');
  const fast=steps.length>24?250:420;let i=0;
  const iv=setInterval(()=>{const s=steps[i];
    team.classList.remove('lunge','hit');foe.classList.remove('lungeL','hit');void team.offsetWidth;
    if(s.w==='a'){team.classList.add('lunge');foe.classList.add('hit');floatDmg(ar,'-'+s.d,false,72)}
    else{foe.classList.add('lungeL');team.classList.add('hit');floatDmg(ar,'-'+s.d,true,22)}
    const ah=Math.max(0,s.ah),eh=Math.max(0,s.eh);
    document.getElementById('ah').style.width=ah/a.hp*100+'%';document.getElementById('eh').style.width=eh/e.hp*100+'%';
    document.getElementById('aht').textContent=ah;document.getElementById('eht').textContent=eh;
    if(++i>=steps.length){clearInterval(iv);const fr=document.getElementById('fres'),btn=document.getElementById('fclose');btn.disabled=false;
      if(win){const loot={food:Math.round(e.hp*.4),ore:Math.round(e.hp*.25)};
        for(const k in loot)S.res[k]=Math.min(storeCap(),S.res[k]+loot[k]);
        a.list.forEach(({p})=>gainXp(p,20+S.stage*5));S.stage++;foe.style.opacity=.2;
        fr.innerHTML=`🏆 Победа! Добыча: ${fmtCost(loot)}`;addLog(`🏆 Разбиты: ${e.n}`);btn.textContent='🎁 К сундукам';
        save();btn.onclick=()=>openLoot(e)}
      else{fr.textContent='Отряд отступил. Прокачай воинов, надень снаряжение или улучши Караульню.';addLog(`💀 Поражение: ${e.n}`);btn.textContent='Готово';
        save();btn.onclick=()=>{closeM();render()}}}},fast)}

// ---- Сундуки ----
const TIERS=[{n:'Деревянный',b:'url(#wood)',m:'#5a5e68',item:.35,boost:0,mul:1},{n:'Железный',b:'#4a3424',m:'url(#silver)',item:.6,boost:3,mul:1.6},{n:'Королевский',b:'url(#purple)',m:'url(#gold)',item:1,boost:7,mul:2.6}];
function chestSvg(t){const T_=TIERS[t];
  return `<svg viewBox="0 -24 80 94"><ellipse cx="40" cy="66" rx="34" ry="5" fill="#000" opacity=".35"/>

  <rect x="33" y="34" width="14" height="14" rx="2.5" fill="${T_.m}" stroke="${O}" stroke-width=".8"/><circle cx="40" cy="40" r="2" fill="${O}"/><path d="M40 41v4" stroke="${O}" stroke-width="2"/>
  ${t===2?'<circle cx="24" cy="47" r="2.6" fill="#6fe0ff" stroke="#fff" stroke-width=".5"/><circle cx="56" cy="47" r="2.6" fill="#e2453c" stroke="#fff" stroke-width=".5"/>':''}
  <g class="lid"><path d="M6 31V22Q6 6 40 6T74 22V31z" fill="${T_.b}" stroke="${O}" stroke-width="1.2"/><path d="M12 14Q40 0 68 14" stroke="#fff" stroke-opacity=".25" fill="none" stroke-width="2"/>
   <path d="M13 31V11M19 31V9" stroke="${O}" stroke-opacity="0"/><rect x="13" y="9" width="6" height="22" fill="${T_.m}" stroke="${O}" stroke-width=".6"/><rect x="61" y="9" width="6" height="22" fill="${T_.m}" stroke="${O}" stroke-width=".6"/>
   <rect x="34" y="24" width="12" height="7" rx="2" fill="${T_.m}" stroke="${O}" stroke-width=".7"/></g></svg>`}
let LOOT=null;
function openLoot(e){
  const x=Math.random()+S.stage*.03,tier=x>1.1?2:x>.7?1:0,T_=TIERS[tier];
  const prizes=[0,1,2].map(()=>{const it=Math.random()<T_.item;const slot=rnd(['weapon','weapon','armor','helmet']);
    return {coins:Math.round(e.hp*(.6+Math.random()*.9)*T_.mul),item:it?{slot,kind:rnd(Object.keys(KINDS[slot])),r:rollRar(T_.boost+S.stage*.3)}:null}});
  LOOT={prizes,picked:null,lvl:Math.floor(S.stage/2)};
  openM(`<h2 style="margin-top:0;text-align:center">🎁 ${T_.n} сундук</h2><p class="sub" style="text-align:center">Выбери один из трёх — внутри монеты и, может быть, вещь</p>
  <div class="chests">${[0,1,2].map(i=>`<div class="chest idle" id="ch${i}" onclick="pickChest(${i})">${chestSvg(tier)}<div class="prize" id="pz${i}"></div></div>`).join('')}</div>
  <div id="lootres"></div><button class="act" style="width:100%;padding:14px;margin-top:8px;display:none" id="lootok" onclick="closeM();render()">Забрать</button>`);
}
function prizeTxt(z){return `<span style="color:var(--gold)">🪙${fmt(z.coins)}</span>${z.item?`<br><span class="r${z.item.r}">${KINDS[z.item.slot][z.item.kind][z.item.r]}</span>`:''}`}
function burstCoins(el){const svg=el.querySelector('svg');let s='';for(let i=0;i<8;i++)s+=`<circle class="burst" style="--dx:${(i-3.5)*7}px;animation-delay:${i*.04}s" cx="40" cy="26" r="3.4" fill="url(#gold)" stroke="#a36d10" stroke-width=".6"/>`;svg.insertAdjacentHTML('beforeend',s)}
function pickChest(i){if(!LOOT||LOOT.picked!==null)return;LOOT.picked=i;
  document.querySelectorAll('.chest').forEach(c=>c.classList.remove('idle'));
  const el=document.getElementById('ch'+i);el.classList.add('shake');
  setTimeout(()=>{el.classList.remove('shake');el.classList.add('open');burstCoins(el);
    const z=LOOT.prizes[i];const room_=storeCap()-S.res.gold;const got=Math.max(0,Math.min(z.coins,room_));S.res.gold+=got;
    let html=`<p style="text-align:center;font-weight:800">+🪙${fmt(got)}${got<z.coins?' <span class="sub">(склад полон)</span>':''}</p>`;
    if(z.item){const it=mkItem(S,z.item.slot,z.item.kind,z.item.r,LOOT.lvl);html+=itemCard(it,'Новая вещь!');addLog(`🎁 Из сундука: ${it.name}`)}
    document.getElementById('pz'+i).innerHTML=prizeTxt(z);document.getElementById('lootres').innerHTML=html;save();header();
    setTimeout(()=>{[0,1,2].filter(j=>j!==i).forEach(j=>{const c=document.getElementById('ch'+j);c.classList.add('open','missed');document.getElementById('pz'+j).innerHTML=prizeTxt(LOOT.prizes[j])});
      document.getElementById('lootok').style.display=''},700)},520)}
function itemCard(it,title){return `<div class="itemcard"><div class="icon b${it.r}">${itemIcon(it)}</div><div style="flex:1"><div class="sub">${title||SLOTN[it.slot]}</div><b class="r${it.r}">${it.name}</b><div class="stats">${RAR[it.r].n} · ${statTxt(it)}</div></div></div>`}

// ---- Кузня: ковка ----
const craftCost=r=>({ore:Math.round(50*Math.pow(1.45,r.lvl-1)),gold:Math.round(40*Math.pow(1.45,r.lvl-1))});
function craft(id){const r=room(id),c=craftCost(r);if(!canPay(c)){toast('Нужно '+fmtCost(c));return}
  if(!crew(r).length){toast('В Кузне нет мастеров');return}
  pay(c);const sk=crew(r).reduce((a,p)=>a+p.sk.craft,0);const it=randItem(Math.floor(S.stage/2)+r.lvl-1,(r.lvl-1)*2+sk*.3);
  addLog(`⚒️ Выкована вещь: ${it.name}`);save();header();
  openM(`<h2 style="margin-top:0">⚒️ Кузня выковала</h2>${itemCard(it)}<div class="row" style="margin-top:10px"><button class="act" style="flex:1" onclick="craft(${id})">Ещё раз: ${fmtCost(c)}</button><button class="act sec" onclick="tab='items';syncTabs();closeM();render()">В сумку</button></div>`)}

// ---- Экипировка ----
function equip(iid,pid){const it=item(iid),p=S.people.find(x=>x.id==pid);if(!it||!p)return;
  const prev=owner(it);if(prev)prev.eq[it.slot]=null;p.eq[it.slot]=it.id;toast(`${p.name}: ${it.name}`);save();render()}
function unequip(pid,slot){const p=S.people.find(x=>x.id==pid);if(p){p.eq[slot]=null;save();render()}}
function sell(iid){const it=item(iid);if(!it||owner(it))return;const pr=sellPrice(it);S.res.gold=Math.min(storeCap(),S.res.gold+pr);S.items=S.items.filter(x=>x!==it);toast(`Продано: +🪙${pr}`);save();render()}
function openSlot(pid,slot){const p=S.people.find(x=>x.id==pid);const cur=item(p.eq[slot]);
  const list=S.items.filter(i=>i.slot===slot&&i!==cur).sort((a,b)=>(b.atk+b.hp)-(a.atk+a.hp));
  openM(`<div class="row"><b class="grow" style="font-size:17px">${SLOTN[slot]} для ${p.name}</b><button class="act sec" onclick="closeM()">✕</button></div>
  ${cur?itemCard(cur,'Надето')+`<button class="act sec" style="margin-top:6px" onclick="unequip(${p.id},'${slot}');closeM()">Снять</button>`:''}
  <h2>В сумке</h2>${list.length?list.map(it=>{const o=owner(it);return `<div class="opt"><div class="icon b${it.r}">${itemIcon(it)}</div><div style="flex:1;min-width:0"><b class="r${it.r}">${it.name}</b><div class="stats">${statTxt(it)}${o?` · <span class="sub">у ${o.name}</span>`:''}</div></div><button class="act" onclick="equip(${it.id},${p.id});closeM()">Надеть</button></div>`}).join(''):'<p class="sub">Пусто. Вещи выпадают из сундуков после боя и куются в Кузне.</p>'}`)}
function gainXp(p,x){p.xp+=x;while(p.xp>=p.lvl*50){p.xp-=p.lvl*50;p.lvl++;const k=rnd(Object.keys(p.sk));p.sk[k]++;addLog(`⭐ ${p.name} достиг ур. ${p.lvl}`)}}
function train(id){const p=S.people.find(x=>x.id==id);const c={food:40*p.lvl};
  if(!canPay(c)){toast('Нужно '+fmtCost(c));return}pay(c);gainXp(p,50);toast(`${p.name} потренировался`);save();render()}

// ================= Окна =================
function openM(html){document.getElementById('mbox').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeM(){document.getElementById('modal').classList.remove('show')}
function tapRoom(id){if(moving){if(moving===id){moving=null;render()}else toast('Выбери пустое подсвеченное место');return}openRoom(id)}
function tapEmpty(f,c){if(moving){placeMove(f,c);return}openBuild(f,c)}
function openRoom(id){
  const r=room(id),t=T[r.t],c=upCost(r),cr=crew(r),nb=neighbors(r);
  let info='';
  if(t.res)info=`<p>${RES[t.res].i} ${fmt(rate(r))}/ч · накоплено ${fmt(r.stock)}/${fmt(capOf(r))}${nb?` · <span style="color:var(--green)">соседи +${nb*15}%</span>`:''}</p>`;
  if(r.t==='bunk')info=`<p>Даёт ${2+r.lvl} мест для жителей.</p>`;
  if(r.t==='guard')info=`<p>Бонус к силе воинов: +${(r.lvl-1)*25}%</p>`;
  const free=S.people.filter(p=>p.room!==r.id);
  const workers=t.skill?`<h2>Работники ${cr.length}/${slots(r)}</h2>`+cr.map(p=>`<div class="opt">${person(p,28)}<div style="flex:1"><b>${p.name}</b> <span class="pill">ур. ${p.lvl}</span><div class="sub">${SKILLS[t.skill]} ${p.sk[t.skill]}</div></div><button class="act sec" onclick="assign(${p.id},'none');openRoom(${id})">✕</button></div>`).join('')+
    (cr.length<slots(r)&&free.length?`<select onchange="assign(this.value,${id});openRoom(${id})"><option>＋ Поставить жителя…</option>${free.sort((a,b)=>b.sk[t.skill]-a.sk[t.skill]).map(p=>`<option value="${p.id}">${p.name} — ${SKILLS[t.skill]} ${p.sk[t.skill]}${p.room?' (занят)':''}</option>`).join('')}</select>`:''):'';
  openM(`<div class="opt" style="padding:0;overflow:hidden;height:96px;position:relative">${art(r.t,t.w*100,r.lvl)}</div>
  <div class="row"><div class="grow"><b style="font-size:17px">${t.i} ${t.n}</b> <span class="pill">ур. ${r.lvl}</span><div class="sub">${t.d} · этаж ${r.f+1}</div></div><button class="act sec" onclick="closeM()">✕</button></div>
  ${info}<div class="row" style="flex-wrap:wrap">${t.res?`<button class="act" onclick="collectRoom(${id});openRoom(${id})">Собрать</button>`:''}
  <button class="act sec" onclick="upgrade(${id})" ${canPay(c)&&r.lvl<=S.tower?'':'disabled'}>⬆️ Ур. ${r.lvl+1}: ${fmtCost(c)}</button>
  <button class="act sec" onclick="startMove(${id})">↔️ Переставить</button>${r.t==='forge'?`<button class="act" onclick="craft(${id})">⚒️ Выковать: ${fmtCost(craftCost(r))}</button>`:''}</div>${workers}`);
}
function openHall(){const c=towerCost();
  openM(`<div class="opt" style="padding:0;overflow:hidden;height:96px;position:relative">${art('hall',500)}</div>
  <div class="row"><div class="grow"><b style="font-size:17px">🏰 Башня старосты</b> <span class="pill">ур. ${S.tower}</span><div class="sub">Сердце крепости</div></div><button class="act sec" onclick="closeM()">✕</button></div>
  <p>Этажей: ${floors()} · склад ${fmt(storeCap())} · комнаты до ур. ${S.tower+1}</p>
  <button class="act" style="width:100%;padding:14px" onclick="upTower()" ${canPay(c)?'':'disabled'}>⬆️ Ур. ${S.tower+1}${floors()<10?' (+этаж)':''}: ${fmtCost(c)}</button>`)}
function openBuild(f,c){
  openM(`<div class="row"><b class="grow" style="font-size:17px">🔨 Строительство · этаж ${f+1}</b><button class="act sec" onclick="closeM()">✕</button></div>`+
  Object.keys(T).map(k=>{const t=T[k],cost=buildCost(k),ok=fits(f,c,t.w);
    return `<div class="opt"><div class="pv" style="width:${t.w*36}px">${art(k,t.w*100)}</div><div style="flex:1;min-width:0"><b>${t.n}</b> <span class="pill">${t.w} кл.</span><div class="sub">${t.d}${ok?'':' · не помещается'}</div></div>
    <button class="act" onclick="build('${k}',${f},${c})" ${ok&&canPay(cost)?'':'disabled'}>${fmtCost(cost)}</button></div>`}).join(''))}

// ================= Ходьба жителей =================
const WK={};
function walkLoop(){
  document.querySelectorAll('.walker').forEach(el=>{
    const id=el.dataset.id,w=+el.dataset.w;
    let s=WK[id];if(!s)s=WK[id]={x:6+Math.random()*78,dir:Math.random()<.5?1:-1,wait:rand(120),sp:.06+Math.random()*.06};
    if(s.wait>0){s.wait--;el.classList.add('idle')}
    else{el.classList.remove('idle');s.x+=s.dir*s.sp/w;if(s.x>86||s.x<4){s.dir*=-1;s.x=Math.max(4,Math.min(86,s.x))}if(Math.random()<.005)s.wait=80+rand(160)}
    el.style.left=s.x+'%';el.firstElementChild.style.transform=`scaleX(${s.dir})`;
  });
  requestAnimationFrame(walkLoop);
}
function walker(p,w){const s=WK[p.id];return `<div class="walker${s&&s.wait>0?' idle':''}" data-id="${p.id}" data-w="${w}" style="left:${s?s.x:50}%"><div class="flip" style="transform:scaleX(${s?s.dir:1})">${person(p)}</div></div>`}

// ================= Экраны =================
function header(){document.getElementById('lvl').textContent='· башня ур. '+S.tower;const cap=fmt(storeCap());
  document.getElementById('res').innerHTML=Object.keys(RES).map(k=>`<span class="chip">${RES[k].i} ${fmt(S.res[k])}<i>/${cap}</i></span>`).join('')+`<span class="chip">👥 ${S.people.length}<i>/${maxPeople()}</i></span>`}
let lastScroll=null;
function render(){
  tick(Date.now());header();
  const sc=document.querySelector('.scroller');if(sc)lastScroll=sc.scrollLeft;
  const v=document.getElementById('view');
  v.innerHTML=tab==='castle'?castleView():tab==='people'?peopleView():tab==='raid'?raidView():tab==='items'?itemsView():menuView();
  const ns=document.querySelector('.scroller');if(ns)ns.scrollLeft=lastScroll===null?(ns.scrollWidth-ns.clientWidth)/2:lastScroll;
}
function refresh(){tick(Date.now());header();
  document.querySelectorAll('.stock[data-rid]').forEach(el=>{const r=room(el.dataset.rid);if(!r)return;const v=Math.floor(r.stock);
    el.style.display=v>=1?'':'none';el.lastChild.textContent=fmt(v);el.classList.toggle('ready',r.stock>=capOf(r)*.3)})}
function roomCell(r){
  const t=T[r.t],cr=crew(r),nb=neighbors(r);
  const st=t.res?`<div class="stock ${r.stock>=capOf(r)*.3?'ready':''}" data-rid="${r.id}" style="${r.stock>=1?'':'display:none'}" onclick="collectRoom(${r.id},event)">${RES[t.res].i}<span>${fmt(r.stock)}</span></div>`:'';
  return `<div class="cell ${moving===r.id?'moving':''}" style="grid-column:${r.c+2}/span ${t.w}" onclick="tapRoom(${r.id})">${art(r.t,t.w*100,r.lvl)}
    <div class="lbl${t.res?'':' wide'}">${t.n} <span class="lv">${r.lvl}</span>${nb?` <span class="bn">+${nb*15}%</span>`:''}</div>${st}
    ${cr.map(p=>walker(p,t.w)).join('')}${slots(r)?`<div class="slots">👤${cr.length}/${slots(r)}</div>`:''}</div>`;
}
function castleView(){
  const g=grid();let rows='';const mv=moving?room(moving):null;
  const FW=26*2+92*COLS+3*(COLS+1);
  for(let f=floors()-1;f>=0;f--){
    let cells=`<div class="side" style="grid-column:1">${sideArt(f)}</div>`;
    for(let c=0;c<COLS;c++){const id=g[f][c];
      if(id!==null){const r=room(id);if(r.c===c)cells+=roomCell(r);continue}
      const tg=mv&&fits(f,c,T[mv.t].w,mv.id)?'target':'';
      cells+=`<div class="cell empty ${tg}" style="grid-column:${c+2}/span 1" onclick="tapEmpty(${f},${c})">${emptyArt()}<div class="plus"><b>${tg?'⬇':'＋'}</b>${tg?'сюда':'строить'}</div></div>`;
    }
    cells+=`<div class="side" style="grid-column:${COLS+2}">${sideArt(f+1)}</div>`;
    rows+=`<div class="floor">${cells}</div>`;
  }
  return (mv?`<div class="movebar"><span style="flex:1">↔️ Куда поставить: ${T[mv.t].n}?</span><button class="act sec" onclick="moving=null;render()">Отмена</button></div>`:
    `<button class="act big" onclick="collectAll()">🧺 Собрать всё</button>`)+
  `<div class="scroller"><div class="scene">${skySvg()}${landSvg()}<div class="castle">${roofSvg(FW)}<div class="body">
    <div class="floor"><div class="side" style="grid-column:1">${sideArt(1)}</div><div class="cell" style="grid-column:2/span ${COLS}" onclick="moving?0:openHall()">${art('hall',500,S.tower)}<div class="lbl">Башня старосты <span class="lv">${S.tower}</span></div></div><div class="side" style="grid-column:${COLS+2}">${sideArt(0)}</div></div>
    ${rows}</div>${baseSvg(FW)}</div></div></div>
  <p class="sub hint">Нажми на комнату — улучшить, переставить, поставить жителей. Пустая клетка — стройка. Одинаковые комнаты рядом (сбоку или над/под) дают +15%. Замок можно листать вбок.</p>
  <h2>Летопись</h2><div class="log" style="margin:0 12px">${S.log.map(l=>`<div>${l}</div>`).join('')||'<div>Пока тихо…</div>'}</div>`;
}
const roomName=r=>`${T[r.t].i} ${T[r.t].n} (эт. ${r.f+1})`;
function slotBtns(p){return `<div class="slotrow">${['weapon','armor','helmet'].map(sl=>{const it=item(p.eq[sl]);
  return `<div class="slot ${it?'b'+it.r:''}" onclick="openSlot(${p.id},'${sl}')">${it?itemIcon(it)+`<span class="r${it.r}" style="font-size:9.5px">${statTxt(it)}</span>`:`<b style="font-size:20px;opacity:.5">＋</b>${SLOTN[sl]}`}</div>`}).join('')}</div>`}
function peopleView(){
  const left=S.nextRecruit-Date.now();
  const free=left<=0?`<button class="act" onclick="recruit(false)">Позвать</button>`:`<span class="pill">бесплатно через ${Math.ceil(left/60e3)} мин</span>`;
  const work=S.rooms.filter(r=>T[r.t].skill);
  const opts=p=>`<option value="none">— отдыхает —</option>`+work.map(r=>`<option value="${r.id}" ${p.room===r.id?'selected':''}>${roomName(r)} ${crew(r).length}/${slots(r)}</option>`).join('');
  return `<div class="card row"><span class="grow">Новые жители</span>${free}<button class="act sec" onclick="recruit(true)">🪙${100*S.people.length}</button></div>`+
  S.people.map(p=>{const fs=fighterStats(p);return `<div class="card"><div class="row" style="align-items:flex-start"><div class="portrait">${person(p,60)}</div>
  <div class="grow" style="min-width:0"><b>${p.name}</b> <span class="pill">ур. ${p.lvl}</span>
  <div class="bar"><div style="width:${p.xp/(p.lvl*50)*100}%"></div></div>
  <div class="stats">⚔️ ${fs.atk} · ❤️ ${fs.hp}</div>
  <div class="sub" style="margin-top:3px">${Object.keys(p.sk).map(k=>SKILLS[k]+' '+p.sk[k]).join(' · ')}</div>
  <button class="act sec" style="margin-top:6px;padding:6px 10px" onclick="train(${p.id})">🏋️ Тренировать 🥕${40*p.lvl}</button></div></div>
  ${slotBtns(p)}<select onchange="assign(${p.id},this.value)">${opts(p)}</select></div>`}).join('');
}
function itemsView(){
  const list=[...S.items].sort((a,b)=>b.r-a.r||(b.atk+b.hp)-(a.atk+a.hp));
  const fg=S.rooms.find(r=>r.t==='forge');
  return `<div class="card"><b>🎒 Сумка</b> <span class="pill">${list.length} вещ.</span><p class="sub">Вещи выпадают из сундуков после побед и куются в Кузне. Надетое видно на жителе и усиливает его в бою.</p>
  ${fg?`<button class="act" style="width:100%" onclick="craft(${fg.id})">⚒️ Выковать в Кузне: ${fmtCost(craftCost(fg))}</button>`:''}</div>`+
  (list.length?list.map(it=>{const o=owner(it);return `<div class="card row"><div class="icon b${it.r}">${itemIcon(it)}</div>
   <div style="flex:1;min-width:0"><b class="r${it.r}">${it.name}</b><div class="stats">${SLOTN[it.slot]} · ${statTxt(it)}</div><div class="sub">${o?'Надето: '+o.name:RAR[it.r].n}</div>
   <select onchange="if(this.value)equip(${it.id},this.value)"><option value="">${o?'Передать…':'Надеть на…'}</option>${S.people.filter(p=>p!==o).map(p=>`<option value="${p.id}">${p.name} (⚔️${fighterStats(p).atk})</option>`).join('')}</select></div>
   ${o?`<button class="act sec" onclick="unequip(${o.id},'${it.slot}')">Снять</button>`:`<button class="act sec" onclick="sell(${it.id})">🪙${sellPrice(it)}</button>`}</div>`}).join(''):'<p class="sub hint">Пока пусто.</p>');
}
function raidView(){const e=enemy(),a=armyPower();
  return `<div class="card"><div style="text-align:center"><b style="font-size:17px">${e.n}${e.loop?' +'+e.loop:''}</b><div class="sub">❤️ ${e.hp} · ⚔️ ${e.atk}</div></div>
  ${a.n?arena(a,e):'<p class="sub">В Караульне никого нет — поставь туда жителей.</p>'}
  <p style="text-align:center">Твой отряд: ${a.n} воин. · ❤️ ${a.hp} · ⚔️ ${a.atk}</p>
  <button class="act" style="width:100%;padding:14px" onclick="fight()">⚔️ В бой</button></div>
  <div class="card sub">Воины — жители в Караульнях. Сила зависит от навыка «Бой», уровня, снаряжения и уровня Караульни. После победы — сундук с монетами и шансом на вещь. Пройдено волн: ${S.stage}.</div>`}
function menuView(){
  return `<div class="card"><b>Как играть</b><p class="sub">Комнаты работают, даже когда игра закрыта. Заходи вечером, собирай урожай, строй и переставляй комнаты, отбивай набеги. Склад общий и ограничен уровнем Башни старосты.</p></div>
  <div class="card"><b>Сохранение</b><p class="sub">Прогресс хранится в этом браузере. Скопируй код, чтобы не потерять его или перенести.</p>
  <textarea id="code" readonly>${btoa(unescape(encodeURIComponent(JSON.stringify(S))))}</textarea>
  <div class="row" style="margin-top:6px"><button class="act sec" onclick="copyCode()">Скопировать</button><button class="act sec" onclick="importCode()">Загрузить код…</button></div></div>
  <div class="card"><button class="act sec" style="background:var(--red)" onclick="askReset()">Начать заново</button></div>`}
function copyCode(){const t=document.getElementById('code');navigator.clipboard.writeText(t.value).then(()=>toast('Скопировано'),()=>{t.select();toast('Выдели и скопируй вручную')})}
function importCode(){openM(`<b>Вставь код сохранения</b><textarea id="imp"></textarea><div class="row" style="margin-top:8px"><button class="act" id="iok">Загрузить</button><button class="act sec" onclick="closeM()">Отмена</button></div>`);
  document.getElementById('iok').onclick=()=>{try{let s=JSON.parse(decodeURIComponent(escape(atob(document.getElementById('imp').value.trim()))));if(!s.res)throw 0;if(s.v!==3)s=fresh(s);S=normalize(s);save();closeM();toast('Загружено');render()}catch(e){toast('Код не подходит')}}}
function askReset(){openM(`<b>Точно начать заново?</b><p>Весь прогресс пропадёт.</p><div class="row"><button class="act" style="background:var(--red)" id="rok">Да</button><button class="act sec" onclick="closeM()">Нет</button></div>`);
  document.getElementById('rok').onclick=()=>{S=normalize(fresh());save();closeM();render()}}
let tt;function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1800)}

// ================= Запуск =================
function syncTabs(){document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===tab))}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;syncTabs();render()});
S=load()||normalize(fresh());
const away=(Date.now()-S.last)/60e3;
render();walkLoop();
if(away>5)setTimeout(()=>toast(`С возвращением! Тебя не было ${away>90?Math.round(away/60)+' ч':Math.round(away)+' мин'} — урожай ждёт`),300);
setInterval(()=>{if(document.getElementById('modal').classList.contains('show'))return;
  if(tab==='castle')refresh();else if(tab!=='menu'&&!document.activeElement.matches('select'))render()},2000);
setInterval(save,10000);
addEventListener('visibilitychange',()=>{if(document.hidden)save();else refresh()});
</script>
</body>
</html>
